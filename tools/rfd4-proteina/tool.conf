# RFD4-Proteina -- the IPD/NVIDIA all-atom flow model that co-designs sequence
# and structure. Released 2026-10-19 under BSD-3-Clause.
#
# "RFdiffusion4" and "Proteina" are this ONE model. Standalone Proteina is its
# ancestor, not a sibling, and has a different licence for its weights (NVIDIA
# Open Model License, via NGC) -- so do not reach for one entry's provenance to
# justify the other. This entry is also NOT rfdiffusion3: different weights,
# different CLI, different representation. Checked 2026-11-16.
NAME=rfd4-proteina
VERSION=0.0.3
KIND=container
STATUS=planned
# BOTH the code AND the weights are BSD-3-Clause, confirmed from the HF model
# card 2026-11-16: frontmatter `license: bsd-3-clause`, and the licence section
# says "The BSD 3-Clause license covers the RFD4-Proteina model, weights and
# code only." The repo reports `gated: False` from the API. So weights come
# through fetch-weights.sh and NOT through assets.tsv -- which was the open
# question, because the optional AlphaFold2/OpenFold3 refolding assets bundled
# in the same repo DO carry separate terms, "some of which restrict commercial
# use or redistribution". This entry stages none of them; see NOTE.
LICENSE=BSD-3-Clause
UPSTREAM=https://github.com/RosettaCommons/RFD4-Proteina
# TWO pins, because one string cannot express this and a single pin would be
# wrong either way. The weights live at the revision the tool's OWN config
# declares (configs/inference.yaml:hf_ckpt_revision), which upstream calls the
# source of truth for the model. The runtime/ directory holding the .sif images
# DID NOT EXIST at that commit -- every path under it 404s there -- so the image
# is pinned at the repo revision that carries it.
#
# Verified 2026-11-16 that this is safe rather than a mismatch: config.json and
# model.safetensors are BYTE-IDENTICAL at both revisions (LFS oid
# 5b549dd61adb2f6c6b5cb95bda13f40f5e31556b4e6c755edc0ca6f011c68fb0, which is
# also release-checkpoints.json's own bundle_sha256). Upstream warns the flow
# model and autoencoder "must be used together" and are not interchangeable with
# the previous release's, so this check is the one that matters here.
UPSTREAM_REF="rfd4-proteina==0.0.3; hf weights @a06e2509c7033b010fc43614e9fd840303588502; hf image @5ec66c399bf0b48727ab24e6b298dcf33864fa07"
NOTE="Antibody/TCR CDR redesign on a FIXED framework, against an optional fixed antigen, with ligands and covalent polymer-ligand bonds in the representation. Four things to know before the first run. (1) THE CLI CANNOT RUN ON A CPU despite hardware.accelerator being a config key: generate.py hard-codes L.Trainer(accelerator='gpu'), so a CPU partition gets a Lightning traceback rather than a slow success. The condition-spec BUILDER is CPU-only and is where an input is validated, which is the only part worth testing without a GPU. (2) THE BOND IS INFERRED FROM THE INPUT FILE'S OWN _struct_conn AND THERE IS NO WAY TO DECLARE ONE, the same trap rfdiffusion3 carries. Worse here: atomworks INFERS a bond order from a CCD template when pdbx_value_order is '?', '.' or empty, and a non-CCD ligand has no template -- so write 'sing' explicitly. An unrecognised order is a loud ValueError on this route, which is the safe direction. (3) ITS CONDITIONS ARE SOFT by upstream's own words, 'not hard output constraints, check adherence when exclusions matter', so a declared bond is a request and the caller must gate on the output's geometry. (4) metrics_tags=[antibody] SILENTLY ENABLES ALPHAFOLD-3: the antibody tag gates both antibody_contacts and the af3 refolding oracle. Run with the oracle subgroups removed, never with the whole metrics group removed -- '~metrics' also deletes every oracle-free reward metric and leaves beam search with no reward model at all. Also: skip_existing defaults TRUE, so a re-run into a populated out_dir publishes the previous run's structures as its own; and a stale results_<config>_<job_id>.csv one directory ABOVE out_dir makes the process sys.exit(0) having generated nothing."

IMAGE=rfd4_proteina_0.0.3_cu13.sif
GPU=1
# Published by upstream beside the image as a .sha256 sidecar, fetched and
# verified 2026-11-16. This is the first entry in this registry able to carry a
# true image digest without chpc-tool learning to compute one: the digest is a
# fact about the published artifact rather than about one host's copy, which is
# exactly the objection that left the consuming project's ADR 0027 Part 3 open.
# fetch-weights.sh verifies it at download and refuses on mismatch.
DIGEST=sha256:058a27dff02778cd7304cf8955c73115f6baaa4dfc0202540c73a10a403fa957
# NOT MEASURED YET. The cu13 wheel set (torch>=2.11, cuequivariance-ops-cu13,
# tmol[cu13], nvidia-cutlass-dsl) should carry sm_120, and the host this is
# being staged for is an RTX 5090 at cc 12.0 with driver 595.99.02 / CUDA 13.2 --
# but "should" is what GPU_MAX_CC exists to replace. Fill it from
# torch._C._cuda_getArchFlags() inside the built image, NOT from
# torch.cuda.get_arch_list(): the rfdiffusion3 entry records one image answering
# the latter with an empty list while the former answered correctly.
GPU_MAX_CC=
# Nothing has run. Empty is the honest value and h8 doctor reports it rather
# than refusing.
GPU_TESTED=
# 0, deliberately, and this is a difference from rfdiffusion3. That entry needs
# an overlay because foundry calls dotenv.set_key on /app/foundry/.env whenever
# it resolves a checkpoint. RFD4 only READS its environment (generate.py's
# main_hydra calls load_dotenv()), and hydra's run directory and the torch
# compile cache both land in the writable run directory. Raise this to 1 only on
# a measured read-only-filesystem error, not pre-emptively.
WRITABLE_TMPFS=0
# /opt/rfd4, measured inside the cu13/cpu images 2026-11-16 -- NOT
# /opt/rfd4-proteina, which is the plausible guess and is wrong. Note the python
# package itself is a system site-packages install
# (/usr/local/lib/python3.12/site-packages/rfproteina) and the console scripts
# are on PATH at /usr/local/bin, so APPDIR is upstream's project root rather
# than the import root.
APPDIR=/opt/rfd4
# The generation console script. rfd4-evaluate is DELIBERATELY NOT the entry:
# it runs AlphaFold2/AlphaFold3/OpenFold3 as refolding oracles, which the
# consuming project rules out as a second scoring path outside its objective
# versioning. Leaving it out of ENTRY means `chpc-tool exec rfd4-proteina
# --some-flag` cannot reach it by accident.
ENTRY=rfd4-generate

# Weights are ~1.7 GB and are NOT in the image. Two routes exist and this entry
# uses the BUNDLE one: utils/hub.py short-circuits snapshot_download when
# hf_ckpt_path names a LOCAL DIRECTORY, reads config.json + model.safetensors,
# and forces autoencoder_ckpt_path=None because the bundle carries the
# autoencoder config inside it. That is one directory, two files, no network and
# one digest -- against the ckpt_path/ckpt_name/autoencoder_ckpt_path route's two
# multi-gigabyte .ckpt files, a ${oc.env:DATA_PATH} interpolation and an EMA
# overlay step.
#
# DATA_PATH is exported anyway even though the bundle route does not read it,
# because inference.yaml interpolates it for ckpt_path and autoencoder_ckpt_path.
# Unset, any future override of hf_ckpt_path turns into an OmegaConf resolution
# failure rather than a clear message.
tool_exports() {
  echo "SIF_RFD4_PROTEINA=\"$(_image_path)\""
  echo "DATA_PATH=\"$(_refdata rfd4-proteina)\""
  echo "RFD4_BUNDLE=\"$(_refdata rfd4-proteina)/bundle\""
  # CCD_MIRROR_PATH IS DELIBERATELY NOT EXPORTED, and this is a correction to
  # what this entry said on 2026-11-16. Setting it is a trap: atomworks 3.0.4
  # treats a configured mirror as the ONLY source and disables its biotite
  # fallback entirely -- ccd.py:204 "Local mirror configured - use ONLY mirror
  # codes" and ccd.py:645 "use ONLY mirror, no biotite fallback". So a mirror
  # holding anything less than the whole CCD is strictly worse than no mirror.
  #
  # MEASURED inside this image 2026-11-17, with a mirror holding only M/MOV/MOV.cif
  # in the documented layout:
  #   no mirror      49195 standard codes; ALA loads (13 atoms), MOV loads (73)
  #   MOV-only mirror    1 standard code;  ALA *RAISES* ValueError
  # which is every amino acid becoming an unknown component to buy one ligand
  # that was already there. The P1 composition check passed with no mirror set.
  #
  # The cost of not setting it, stated rather than hidden: the fallback is
  # biotite's BUNDLED CCD, so which dictionary resolves a component is pinned by
  # the biotite inside the image (1.6.0 here) rather than by this registry. That
  # is a real argument for mirroring the CCD *completely* later -- ~49k
  # components, one directory per code -- and until somebody does, VERSION and
  # DIGEST are what make a change in it visible at all.
  #
  # ALLOW_BIOTITE_CCD defaults to true and is left alone: writing it out would
  # be restating a default, and the day atomworks flips it the export would hide
  # the change rather than surface it.
  # Belt and braces for a node with no egress: huggingface_hub then REFUSES
  # rather than hanging, so a misresolved bundle path fails in seconds.
  echo "HF_HUB_OFFLINE=\"1\""
  echo "HF_HOME=\"$(_refdata rfd4-proteina)/hf\""
  # The boltz lesson applied before it costs anything: the default is one
  # directory under a shared home that every concurrent task writes into.
  echo "TRITON_CACHE_DIR=\"/tmp/triton-cache\""
}

tool_doctor() {
  _d="$(_refdata rfd4-proteina)"
  [ -d "$_d/bundle" ] || {
    echo "no model bundle at $_d/bundle -- on the LOGIN node: tools/rfd4-proteina/fetch-weights.sh"
    return 1; }
  # A directory that exists holding nothing is what an interrupted download
  # leaves behind, and hub.load_pretrained_bundle names exactly these two files.
  for _f in config.json model.safetensors; do
    [ -s "$_d/bundle/$_f" ] || {
      echo "$_d/bundle/$_f missing or empty -- that is not an RFD4 model bundle"
      return 1; }
  done
  # The recorded weights digest. Checked for PRESENCE here, not recomputed:
  # sha256 over 1.7 GB on NFS is minutes and doctor is run casually. Its absence
  # means a GeneratorIdentity's weights_digest would be unsourced, which is the
  # thing the consuming project needs this file for.
  [ -s "$_d/bundle/model.safetensors.sha256" ] || {
    echo "bundle present with no sha256 sidecar -- a weights digest would be unsourced"
    echo "  fix: tools/rfd4-proteina/fetch-weights.sh --digests"
    return 1; }
  # A PRESENT ccd/ directory is now a FAILURE rather than a requirement, which
  # is the reverse of what this entry checked on 2026-11-16. See tool_exports:
  # a partial mirror disables atomworks' biotite fallback and takes every amino
  # acid with it. Nothing here creates one, so finding one means somebody
  # followed the old instruction -- and it is inert only because
  # CCD_MIRROR_PATH is no longer exported, which is one edit away from being
  # live again. Refuse it while the reason is still written down.
  [ ! -e "$_d/ccd" ] || {
    echo "there is a CCD mirror at $_d/ccd, and this entry must not have one."
    echo "  atomworks treats a configured mirror as the ONLY source: measured in"
    echo "  this image, a MOV-only mirror leaves 1 standard CCD code and makes"
    echo "  ALA raise, against 49195 codes with no mirror at all. Either remove"
    echo "  it, or mirror the CCD completely and re-export CCD_MIRROR_PATH"
    echo "  deliberately -- a partial one is worse than none."
    return 1; }
  # The covalent stage of test.sh needs 8UDR. Same arrangement as rfdiffusion3:
  # it rides with the weights because the share carries tools/ and not examples/.
  for _f in 8UDR.cif.gz manifest.json; do
    [ -f "$_d/$_f" ] || {
      echo "bundle present but no $_f in $_d -- the covalent stage cannot run"
      echo "  fix: tools/rfd4-proteina/fetch-weights.sh --fixture"
      return 1; }
  done
  echo "bundle $_d/bundle, weights digest recorded, 8UDR fixture, no CCD mirror (correct)"
}
