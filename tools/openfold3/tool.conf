# OpenFold3 -- the OpenFold consortium's open reimplementation of AlphaFold 3.
#
# Apache-2.0 on code AND weights, which is the reason to carry it: it is a
# third Apache-licensed co-folding model beside protenix and intellifold, and
# none of the three restricts what you may do with the structures the way
# alphafold3's parameters do.
#
# It is a RESEARCH PREVIEW in upstream's own words. That is not a disclaimer
# to skim past here: a preview changes its input schema between releases, and
# this entry's whole open question is a schema question.
NAME=openfold3
VERSION=3
KIND=container
# STATUS=planned: nothing is built and nothing has been run.
#
# This entry has a SECOND gate beyond the usual one. `verified` here requires
# a BONDED fold to have run and to have put the bond in the right place --
# see the comment on covalent support below and tools/openfold3/test.sh. It is
# entirely possible for this entry to reach `built` and legitimately never
# reach `verified`; that is a finding, not a failure to finish the work.
STATUS=planned
# Verified against upstream's README 2026-09-24.
LICENSE="Apache-2.0, code and weights, academic and commercial use"
# NOTE THE HYPHEN. The repository is aqlaboratory/openfold-3;
# aqlaboratory/openfold3 is a 404, and openfold (no 3) is the AlphaFold2
# reimplementation, which is a different model.
UPSTREAM=https://github.com/aqlaboratory/openfold-3
UPSTREAM_REF=               # pin the exact pip version here when the image is built
NOTE="COVALENT SUPPORT IS UNQUALIFIED. Upstream's documentation does not mention bondedAtomPairs, covalent bonds, CCD codes, SMILES or ligand atom naming anywhere; it says only that it replicates AlphaFold 3's input features. Whether it accepts a bond, and how it names the atoms at the ends of one, is UNKNOWN and is not assumed here -- test.sh case 2 is what settles it, and this entry must not be called verified on the strength of a container that starts. Upstream ships cuEquivariance AND DeepSpeed4Science kernels, both of which compile at first use, so the image carries a full CUDA/C++ toolchain: this is boltz's Triton trap plus DeepSpeed's op builder, and a missing compiler kills a job mid-run having written nothing. Default parameters from 0.5.0 are OpenBind-0, weights on Hugging Face at OpenFold/OpenFold3. GPU_MAX_CC is UNMEASURED -- see README.md."

IMAGE=openfold3_3.sif
GPU=1
APPDIR=/opt/openfold3
ENTRY=run_openfold          # `run_openfold predict --query_json=...`

# GPU_MAX_CC -- the highest compute capability this image has kernels for.
#
# NOT MEASURED, because nothing has been built. The literal below FAILS CLOSED:
# chpc-tool compares with awk (a+0 > b+0), awk reads a non-numeric string as 0,
# so every device is above this ceiling and `chpc-tool exec openfold3` refuses
# on any GPU node until a real number replaces it.
#
# It matters more here than for most entries. cuEquivariance ships prebuilt
# kernels per architecture; an image whose cuequivariance wheels stop at sm_90
# runs perfectly on an L40S or an H100 and dies on the seven Blackwell nodes
# with `no kernel image is available for execution on the device`, which reads
# as a broken install and is a scheduling accident (doc 05). Five tools in this
# registry already lose jobs to exactly that.
#
# Measure INSIDE the built image, on the LOGIN NODE -- _cuda_getArchFlags needs
# no GPU and no nvidia-smi, so the guard above cannot block its own
# measurement:
#
#   /usr/bin/apptainer exec "$CHPC_CONTAINERS/openfold3_3.sif" \
#     python -c "import torch; print(torch._C._cuda_getArchFlags())"
#
# Highest sm_NN is the number: sm_120 -> 12.0, sm_90 -> 9.0. Use
# _cuda_getArchFlags, NOT torch.cuda.get_arch_list(), which returns [] with no
# GPU visible -- exactly the login node. openfold3_3.def prints a candidate at
# the end of %post; copying it here is a human step on purpose.
#
# And note what that command does NOT answer: torch's arch flags are torch's.
# If the cuequivariance or DeepSpeed kernels are narrower, the real ceiling is
# lower, and only a fold on a Blackwell node will say so. Boltz's entry is the
# precedent -- its "any gpu node" row is trustworthy because it was actually
# run there (job 1899088, ggpu1-19), not because of an arch-flag list.
GPU_MAX_CC=UNMEASURED

tool_exports() {
  echo "SIF_OPENFOLD3=\"$(_image_path)\""
  echo "OPENFOLD3_WEIGHTS=\"$(_refdata openfold3)\""
  # setup_openfold pulls from Hugging Face. chpc.env points HF_HOME at user
  # scratch, which is right for a cache and wrong for the only copy -- scratch
  # is purged at 30 days (doc 02). Pin it to FAC alongside the weights.
  echo "HF_HOME=\"$(_refdata openfold3)/hf\""
}

tool_doctor() {
  _w="$(_refdata openfold3)"
  [ -d "$_w" ] || { echo "no weights dir at $_w -- on the LOGIN node: tools/openfold3/fetch-weights.sh"; return 1; }
  _n=$(find "$_w" -type f \( -name '*.pt' -o -name '*.ckpt' -o -name '*.safetensors' \) 2>/dev/null | wc -l)
  [ "$_n" -ge 1 ] || { echo "no model parameters under $_w -- on the LOGIN node: tools/openfold3/fetch-weights.sh"; return 1; }

  # Probe, do not assume. This image installs a toolchain on purpose because
  # cuEquivariance and DeepSpeed4Science both compile at first use; a rebuild
  # from a slimmer base would pass every path check and lose every job.
  _cc="toolchain ok"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || _cc="NO C COMPILER in the image: cuEquivariance/Triton cannot build its kernels and DeepSpeed cannot build its ops, so a real fold dies mid-run having written nothing"
    apptainer exec "$(_image_path)" sh -c 'command -v nvcc >/dev/null 2>&1' >/dev/null 2>&1 \
      || _cc="$_cc; no nvcc -- DeepSpeed's JIT op builder needs it"
  else
    _cc="toolchain unchecked (no apptainer here)"
  fi

  _g="GPU_MAX_CC $GPU_MAX_CC"
  case "$GPU_MAX_CC" in
    UNMEASURED) _g="GPU_MAX_CC UNMEASURED -- chpc-tool exec will refuse on every GPU node until it is measured; see tool.conf" ;;
  esac

  # Report the open question every time, because it is the one thing a path
  # check can never see and the one thing that decides whether this tool is
  # usable for the work it was added for.
  echo "weights $_w ($_n file(s)); $_cc; $_g; COVALENT SUPPORT UNQUALIFIED -- run chpc-tool test openfold3"
}
