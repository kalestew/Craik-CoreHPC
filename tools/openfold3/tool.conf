# OpenFold3 -- the OpenFold consortium's open reimplementation of AlphaFold 3.
#
# Apache-2.0 on code AND weights, which is the reason to carry it: it is a
# third Apache-licensed co-folding model beside protenix and intellifold, and
# none of the three restricts what you may do with the structures the way
# alphafold3's parameters do.
#
# It is a RESEARCH PREVIEW in upstream's own words. That is not a disclaimer
# to skim past here: a preview changes its input schema between releases, and
# this entry's whole open question is a schema question.
NAME=openfold3
VERSION=3
KIND=container
# STATUS=built 2026-09-25: the image exists and its %test passed on the
# login node. NOT `verified`: test.sh has not run on a compute node, and
# nothing has been folded with it. The registry's ladder is planned ->
# built -> verified and the middle rung is exactly this state -- a
# container that starts and cannot find its weights looks identical to a
# working one until real work is submitted.
#
# This entry has a SECOND gate beyond the usual one: `verified` requires a
# covalently modified fold to have run and put the bond in the right place.
#
# STATUS=verified 2026-09-27 on ggpu4-03 (H100 NVL), 1 m 26 s. Both gates met,
# and the second one NOT through the field this entry was built around.
# covalent_bonds is inert -- test.sh phase 2a now asserts that as a TRIPWIRE, so
# if upstream wires it up this test fails and says to go and use it. The
# capability lives in non_canonical_residues: YCM at position 6 folded SG-CD at
# 1.671-1.746 A against a 1.81 A ideal in 5 of 5 draws, and the same five
# distances reproduced within 0.004 A on an L40S. See README.md, "Covalent
# support".
STATUS=verified
# Verified against upstream's README 2026-09-24.
LICENSE="Apache-2.0, code and weights, academic and commercial use"
# NOTE THE HYPHEN. The repository is aqlaboratory/openfold-3;
# aqlaboratory/openfold3 is a 404, and openfold (no 3) is the AlphaFold2
# reimplementation, which is a different model.
UPSTREAM=https://github.com/aqlaboratory/openfold-3
UPSTREAM_REF=               # pin the exact pip version here when the image is built
NOTE="COVALENT MODIFICATIONS WORK HERE, BUT NOT THROUGH THE FIELD NAMED FOR THEM -- MEASURED 2026-09-27, reversing this entry's earlier conclusion. THE ROUTE THAT WORKS is non_canonical_residues: {residue_id: CCD_code} on the polymer chain, which builds a modified residue, atomizes it (YCM occupies 10 tokens where CYS occupies 1), and puts its bonds into token_bonds -- so the modification reaches the model as a real bond feature. Measured SG-CD 1.671-1.746 A against a 1.81 A ideal in 5 of 5 draws on an H100 NVL, reproducing within 0.004 A on an L40S. THE BOUND: the CCD component must contain the whole modified residue INCLUDING THE BACKBONE, so this reaches PTMs and cysteine adducts and NOT a drug-sized ligand -- passing MOV (sotorasib) builds its 41 atoms with no backbone and silently cuts the chain in two. A custom component cannot be supplied: ccd_file_path is read only into the TEMPLATE pipeline, and get_structure_with_ref_mols is a staticmethod taking the query alone. THE FIELD THAT IS DEAD is covalent_bonds: the AtomArray is byte-identical with and without it, zero bonds crossing a chain boundary, while its sibling pocket_constraint in the same model has a full consumer chain -- so this is one unwired field, not an aspirational schema. Its endpoint is Atom(chain_id, residue_id, atom_id: INT) with no way to name an atom, so do not use it even after it starts working. A THIRD DEAD FIELD, and the most expensive: seeds in the query JSON is ignored -- the runner reads experiment_settings.seeds, default [42], so a query asking for seeds [1,2,3] folds seed 42 and says nothing; count comes from --num-model-seeds and values from --runner-yaml. STILL TRUE AND STILL IMPORTANT: (1) It does NOT take AlphaFold 3-style JSON. openfold3/projects/of3_all_atom/config/inference_query_format.py defines its own pydantic schema: the top level is {seeds, queries}, a Query carries 'chains' not 'sequences', and a Chain carries molecule_type / chain_ids / ccd_codes / smiles / main_msa_file_paths / paired_msa_file_paths, none of which is an AF3 key. Chain is declared extra=forbid, so an AF3 input is rejected outright. (2) Its bond endpoint is an INTEGER ATOM INDEX: Bond(atom1, atom2) with Atom = (chain_id: str, residue_id: int, atom_id: int). No atom names at all, so an off-by-one moves a bond with nothing to disagree with it. (3) the string covalent_bonds appears in exactly ONE file of that wheel -- its own schema declaration -- and nothing in the inference path reads it, so a covalent_bonds request validates, runs, exits zero, and produces a confident structure with no bond in it. That much was right; the error was concluding 'apo folds only' from it, which held for two days until non_canonical_residues was tried. ORIGINAL TEXT, kept because the reasoning it records is still the right reasoning: COVALENT SUPPORT IS UNQUALIFIED. Upstream's documentation does not mention bondedAtomPairs, covalent bonds, CCD codes, SMILES or ligand atom naming anywhere; it says only that it replicates AlphaFold 3's input features. Whether it accepts a bond, and how it names the atoms at the ends of one, is UNKNOWN and is not assumed here -- test.sh case 2 is what settles it, and this entry must not be called verified on the strength of a container that starts. Upstream ships cuEquivariance AND DeepSpeed4Science kernels, both of which compile at first use, so the image carries a full CUDA/C++ toolchain: this is boltz's Triton trap plus DeepSpeed's op builder, and a missing compiler kills a job mid-run having written nothing. Default parameters from 0.5.0 are OpenBind-0, weights on Hugging Face at OpenFold/OpenFold3. GPU_MAX_CC is 12.0, measured 2026-09-25 in the built image from torch's arch flags (sm_75..sm_120) -- but those are TORCH's flags and the cuEquivariance/DeepSpeed kernels have never run on a Blackwell node, so lower it first if a job on ggpu1-[13-19] dies with what reads as a broken install. molecule_type's accepted values are STILL UNREAD; one login-node command in README.md settles them. See README.md."

IMAGE=openfold3_3.sif
GPU=1
APPDIR=/opt/openfold3
ENTRY=run_openfold          # `run_openfold predict --query_json=...`

# GPU_MAX_CC -- the highest compute capability this image has kernels for.
#
# NOT MEASURED, because nothing has been built. The literal below FAILS CLOSED:
# chpc-tool compares with awk (a+0 > b+0), awk reads a non-numeric string as 0,
# so every device is above this ceiling and `chpc-tool exec openfold3` refuses
# on any GPU node until a real number replaces it.
#
# It matters more here than for most entries. cuEquivariance ships prebuilt
# kernels per architecture; an image whose cuequivariance wheels stop at sm_90
# runs perfectly on an L40S or an H100 and dies on the seven Blackwell nodes
# with `no kernel image is available for execution on the device`, which reads
# as a broken install and is a scheduling accident (doc 05). Five tools in this
# registry already lose jobs to exactly that.
#
# Measure INSIDE the built image, on the LOGIN NODE -- _cuda_getArchFlags needs
# no GPU and no nvidia-smi, so the guard above cannot block its own
# measurement:
#
#   /usr/bin/apptainer exec "$CHPC_CONTAINERS/openfold3_3.sif" \
#     python -c "import torch; print(torch._C._cuda_getArchFlags())"
#
# Highest sm_NN is the number: sm_120 -> 12.0, sm_90 -> 9.0. Use
# _cuda_getArchFlags, NOT torch.cuda.get_arch_list(), which returns [] with no
# GPU visible -- exactly the login node. openfold3_3.def prints a candidate at
# the end of %post; copying it here is a human step on purpose.
#
# And note what that command does NOT answer: torch's arch flags are torch's.
# If the cuequivariance or DeepSpeed kernels are narrower, the real ceiling is
# lower, and only a fold on a Blackwell node will say so. Boltz's entry is the
# precedent -- its "any gpu node" row is trustworthy because it was actually
# run there (job 1899088, ggpu1-19, torch; job 1997377, ggpu1-16, the
# cuequivariance kernel path, 2026-09-26), not because of an arch-flag list.
# MEASURED 2026-09-25 inside the built image, on the login node:
#     torch 2.14.0+cu130, arch flags sm_75 sm_80 sm_86 sm_90 sm_100 sm_120
# sm_120 is present, so this is the second entry in this registry (after boltz)
# that may take a bare --gres=gpu:1 and land on an RTX PRO 6000.
#
# CAVEAT, and it is the one the .def already anticipated: those are TORCH's arch
# flags. Upstream advertises cuEquivariance and DeepSpeed4Science kernels, whose
# own wheels may be narrower, and neither has been exercised on a Blackwell node
# -- nothing has been folded with this image at all. If a job on ggpu1-[13-19]
# dies with what looks like a broken install, that is the first thing to check,
# and this value is the first thing to lower.
GPU_MAX_CC=12.0
# WHERE THIS HAS ACTUALLY RUN, as against what the ceiling above permits.
# Two of the three classes, which is more than most entries here:
#   nvidia_h100_nvl  ggpu4-04, phase 1, 2026-09-27; ggpu4-03, the full test
#                    including the covalent case, job 2008660, 1 m 26 s
#   nvidia_l40s      ggpu1-06, the covalent case, job 2008581 -- the five SG-CD
#                    distances reproduced the H100 NVL's within 0.004 A
# The Blackwell nodes (12.0) remain UNEXERCISED and are exactly what the caveat
# above is about: these are torch's arch flags, and cuEquivariance's and
# DeepSpeed's kernels are their own. A bare --gres=gpu:1 may land there.
GPU_TESTED=nvidia_h100_nvl,nvidia_l40s

tool_exports() {
  echo "SIF_OPENFOLD3=\"$(_image_path)\""
  echo "OPENFOLD3_WEIGHTS=\"$(_refdata openfold3)\""
  # OPENFOLD_CACHE IS THE ONE openfold3 ITSELF READS. OPENFOLD3_WEIGHTS above is
  # this registry's name for the same directory and upstream has never heard of
  # it, so without this line run_openfold falls back to ~/.openfold3 and dies
  # with "Default checkpoint openbind-2025-06-30-174k not found in
  # /home/.../.openfold3, cowardly refusing to perform inference" -- naming a
  # path nobody configured, on an installation whose weights are present and
  # whose doctor says OK.
  #
  # It resolves in two hops: OPENFOLD_CACHE gives the cache directory,
  # get_default_checkpoint_dir reads the `ckpt_root` file inside it for the
  # actual parameter directory, and the registry maps the checkpoint NAME to a
  # file (openbind-2025-06-30-174k -> of3-ob-2025-06-30-174k.pt). fetch-weights.sh
  # writes ckpt_root, so both hops already worked; only this export was missing.
  echo "OPENFOLD_CACHE=\"$(_refdata openfold3)\""
  # setup_openfold pulls from Hugging Face. chpc.env points HF_HOME at user
  # scratch, which is right for a cache and wrong for the only copy -- scratch
  # is purged at 30 days (doc 02). Pin it to FAC alongside the weights.
  echo "HF_HOME=\"$(_refdata openfold3)/hf\""
}

tool_doctor() {
  _w="$(_refdata openfold3)"
  [ -d "$_w" ] || { echo "no weights dir at $_w -- on the LOGIN node: tools/openfold3/fetch-weights.sh"; return 1; }
  _n=$(find "$_w" -type f \( -name '*.pt' -o -name '*.ckpt' -o -name '*.safetensors' \) 2>/dev/null | wc -l)
  [ "$_n" -ge 1 ] || { echo "no model parameters under $_w -- on the LOGIN node: tools/openfold3/fetch-weights.sh"; return 1; }

  # Probe, do not assume. This image installs a toolchain on purpose because
  # cuEquivariance and DeepSpeed4Science both compile at first use; a rebuild
  # from a slimmer base would pass every path check and lose every job.
  _cc="toolchain ok"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || _cc="NO C COMPILER in the image: cuEquivariance/Triton cannot build its kernels and DeepSpeed cannot build its ops, so a real fold dies mid-run having written nothing"
    apptainer exec "$(_image_path)" sh -c 'command -v nvcc >/dev/null 2>&1' >/dev/null 2>&1 \
      || _cc="$_cc; no nvcc -- DeepSpeed's JIT op builder needs it"
  else
    _cc="toolchain unchecked (no apptainer here)"
  fi

  _g="GPU_MAX_CC $GPU_MAX_CC"
  case "$GPU_MAX_CC" in
    UNMEASURED) _g="GPU_MAX_CC UNMEASURED -- chpc-tool exec will refuse on every GPU node until it is measured; see tool.conf" ;;
  esac

  # Report the open question every time, because it is the one thing a path
  # check can never see and the one thing that decides whether this tool is
  # usable for the work it was added for.
  # Report the covalent route every time, because the field a user will reach
  # for first is the one that does not work, and nothing in the tool says so.
  echo "weights $_w ($_n file(s)); $_cc; $_g; COVALENT: use non_canonical_residues {residue_id: CCD_code} -- the covalent_bonds field is INERT (measured 2026-09-27: identical AtomArray with and without it). The CCD component must carry the amino-acid backbone, so PTMs yes, drug-sized adducts no. Also note: the seeds field in your query JSON is ignored, default seed 42"
}
