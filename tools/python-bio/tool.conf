# The light python layer: gemmi, numpy, biopython, and deliberately no torch.
# See README.md -- the RECIPE belongs to the project, this entry is the
# mechanism for having it on CoreHPC.
NAME=python-bio
VERSION=
KIND=conda
# Built and verified on CoreHPC 2026-09-17: python 3.12.14, gemmi 0.7.5,
# numpy 2.5.3, biopython 1.83, from IgGase_eng/envs/iggase.yml.
#
# STATUS here is a claim about the MECHANISM, not about any one environment:
# the env name is supplied by the caller through CHPC_PYENV, so `doctor` with
# no CHPC_PYENV correctly reports that the generic `bio` env does not exist.
# Pass the one you mean: CHPC_PYENV=iggase chpc-tool doctor python-bio
STATUS=built
LICENSE="various, all open source"
UPSTREAM=https://conda-forge.org/

# A project picks the environment name and supplies the yml, because the pins
# are its own: a project that asserts recorded numbers off a pairwise alignment
# cannot share an interpreter with one that does not care which numpy it gets.
#   CHPC_PYENV=iggase chpc-tool export python-bio
ENV_NAME=${CHPC_PYENV:-bio}
PREFIX=${CONDA_ENVS_PATH:-${CHPC_USER_SCRATCH:-/mnt/scratch/user/$USER}/envs}/${CHPC_PYENV:-bio}
ENV_YML=                    # the project's recipe, e.g. $CHPC_PROJECT/envs/iggase.yml

tool_exports() {
  echo "PYTHON=\"$PREFIX/bin/python\""
}

# Without CHPC_PYENV there is no environment to check -- PREFIX would point at
# a generic `bio` env that nothing was ever asked to create. Reporting that as
# broken is a false alarm, and doctor is only worth reading if its FAILs are
# real, so this returns 2 ("not checked") and says what to pass instead.
tool_precheck() {
  [ -n "${CHPC_PYENV:-}" ] && return 0
  echo "no environment named -- this entry is the mechanism; the pins belong to"
  echo "the project. Name one: CHPC_PYENV=iggase chpc-tool doctor python-bio"
  return 2
}

tool_doctor() {
  if [ ! -x "$PREFIX/bin/python" ]; then
    echo "no interpreter at $PREFIX/bin/python"
    echo "    rebuild: module load CBI; module load miniforge3; conda env create -f <yml>"
    echo "    (never pipe \`module load\` -- it runs in a subshell and the change never reaches you)"
    return 1
  fi
  _miss=$("$PREFIX/bin/python" - <<'PY' 2>/dev/null || true
mods = []
for m in ("gemmi", "numpy", "Bio"):
    try: __import__(m)
    except Exception: mods.append(m)
print(" ".join(mods))
PY
)
  [ -z "$_miss" ] || { echo "missing modules: $_miss"; return 1; }
  echo "$("$PREFIX/bin/python" -V 2>&1), gemmi + numpy + biopython present"
}
