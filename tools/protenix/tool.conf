# Protenix -- AlphaFold3-class structure prediction, PINNED AT v1 ON PURPOSE.
#
# v2 exists, is newer and is larger (464 M vs 368 M parameters). Its WEIGHTS
# are released under no open-source licence at all -- upstream's own words are
# "proprietary and confidential information of the rights holder ... may not be
# reproduced, distributed, sublicensed, disclosed, or otherwise transferred to
# any third party in any form without the express prior written consent of the
# rights holder". The v1 weights, and all of the code, are Apache-2.0 and free
# for commercial use.
#
# This is a therapeutic programme. alphafold3's entry in this registry already
# records what that costs: a weights licence restricts the OUTPUTS, and a
# structure that enters a filing or a partnership is the part that gets asked
# about years after the run. Protenix v1 is the version that does not have that
# problem, so VERSION is 1 and the checkpoint name is pinned below. Do not
# "upgrade" this entry to v2 -- that is a new entry, with a new licence
# conversation, or it is nothing.
NAME=protenix
VERSION=1
KIND=container
# STATUS=planned: nothing is built and nothing has been run. The registry's
# ladder is planned -> built -> verified, and the middle rung matters here
# because a container that starts and cannot find its weights looks identical
# to a working one until real work is submitted. Do not flip this past
# `built` until test.sh passes on a compute node.
# built 2026-09-25, after four separate defects in this recipe: a base with
# no nvcc for an extension protenix compiles AT IMPORT, an unpinned install
# that resolved 2.0.0 (the generation whose weights this entry forbids), a
# missing ninja, and /opt/venv/bin absent from PATH during %post so torch
# could not run the ninja it had. NOT `verified`: test.sh has not run on a
# compute node.
STATUS=built
LICENSE="code Apache-2.0; v1 model parameters Apache-2.0, commercial use permitted. v2 weights are PROPRIETARY, released under no open-source licence -- never stage them here."
UPSTREAM=https://github.com/bytedance/Protenix
UPSTREAM_REF="protenix==1.1.0"   # pinned in the .def; PyPI 2.0.0 is the v2 generation
NOTE="Pinned at v1 for the LICENCE, not for the science: v2 weights are proprietary and restrict the outputs, which for a therapeutic programme outlives the run (see alphafold3's entry). Covalent bonds are a top-level covalent_bonds list of {entity1,copy1,position1,atom1,entity2,copy2,position2,atom2}; ENTITIES ARE REFERENCED BY 1-BASED POSITION IN THE sequences LIST, NOT BY CHAIN ID, which is the opposite of the AlphaFold-3 convention every other tool here uses -- reorder the sequences list and every bond silently moves. A SMILES ligand takes either a 0-based atom index into the SMILES string or an element-plus-ordinal name such as C3 or N2 whose ordinal is 1-based; two numbering bases in one list is exactly the kind of thing that produces a plausible structure with the bond in the wrong place. Precomputed MSAs go in via pairedMsaPath and unpairedMsaPath and upstream recommends ABSOLUTE paths; a compute node has no internet, so MSA generation is a login-node stage, never a flag on the fold. GPU_MAX_CC is UNMEASURED -- see the comment on the field. MEASURED 2026-09-25 on the first build attempt: this tool JIT-COMPILES A CUDA EXTENSION AT IMPORT, unconditionally and with no fallback path -- protenix/model/layer_norm/layer_norm.py compiles layer_norm_cuda_kernel.cu the first time the model modules are imported -- so the image needs NVCC, not merely a C compiler, and a -slim base produces an image whose plain 'import protenix' succeeds and which dies on the first real job."

IMAGE=protenix_1.sif
GPU=1
# Where the installation lives inside the image. /opt/venv, not /opt/protenix:
# the recipe installs into a virtual environment because ubuntu24.04 marks its
# interpreter externally managed, and %environment puts /opt/venv/bin on PATH.
APPDIR=/opt/venv
# A console script. CONFIRMED against protenix 1.1.0's own click group rather
# than copied from a README:
#
#   protenix pred -i in.json -o out -s <seeds> -e <samples> -n <model>
#
# The subcommand is `pred`, not `predict` -- `predict` is the function and
# `add_command(predict, name="pred")` is the registration. The default
# --model_name is protenix_base_default_v1.0.0, which is the v1 checkpoint this
# entry is pinned to; name it explicitly anyway, because a default is exactly
# how the wrong generation would arrive quietly.
ENTRY=protenix

# GPU_MAX_CC -- the highest compute capability this image has kernels for.
#
# NOT MEASURED, because nothing has been built, and a number invented here is
# worse than no entry: the gpu partition is three devices (L40S 8.9, H100 NVL
# 9.0, RTX PRO 6000 Blackwell 12.0), a bare --gres=gpu:1 lands on any of them,
# and five tools in this registry already declare 9.0 and die on the Blackwell
# nodes with an error that reads like a broken install (doc 05).
#
# The literal value below is deliberate and it FAILS CLOSED. chpc-tool compares
# with awk (`a+0 > b+0`), and awk reads a non-numeric string as 0, so every
# device is "above" this ceiling and `chpc-tool exec protenix` refuses on any
# GPU node until a real number replaces it. That is the right behaviour while
# the answer is unknown: refusing is recoverable, a wrong ceiling is a job that
# dies twenty minutes in.
#
# Measure it INSIDE the built image, on the LOGIN NODE -- _cuda_getArchFlags
# needs no GPU and no nvidia-smi, which is why the guard above cannot get in
# its own way there:
#
#   /usr/bin/apptainer exec "$CHPC_CONTAINERS/protenix_1.sif" \
#     python -c "import torch; print(torch._C._cuda_getArchFlags())"
#
# The highest sm_NN in that list is the number: sm_120 -> 12.0, sm_90 -> 9.0.
#
# What the FAILED first build printed, for whoever measures it properly: with
# the unpinned install (protenix 2.0.0, torch 2.7.1+cu126) the flags were
#     sm_50 sm_60 sm_70 sm_75 sm_80 sm_86 sm_90
# -- no sm_120, so L40S or H100 and never a bare --gres=gpu:1. That is NOT
# copied into the field below, because it was measured on a different pinned
# version than this entry now installs. Re-measure on the 1.1.0 image.
# Use _cuda_getArchFlags, NOT torch.cuda.get_arch_list(), which returns [] with
# no GPU visible -- precisely the situation you are in on the login node.
# protenix_1.def prints a candidate at the end of %post; that is the same
# measurement, taken at build time, and it still has to be copied here by hand.
# MEASURED 2026-09-25 in the built image, on the login node, on the PINNED
# version (protenix 1.1.0, torch 2.7.1+cu126):
#     arch flags sm_50 sm_60 sm_70 sm_75 sm_80 sm_86 sm_90
# No sm_120, so ask for --gres=gpu:nvidia_l40s:1 or an H100 -- or exclude
# ggpu1-[13-19] by name, which keeps both eligible and is what this project's
# job scripts do.
GPU_MAX_CC=9.0

# PROTENIX_ROOT_DIR is where Protenix puts its checkpoints ($ROOT/checkpoint)
# and the chemical component dictionary ($ROOT/common). It defaults to the
# user's HOME, which is wrong twice over on this cluster: HOME is small, and
# the first job on a compute node would try to download from a node with no
# internet. PROTENIX_DATA_ROOT_DIR is the separate training/preprocessed-data
# root; inference does not need it, but naming it stops it defaulting into HOME
# the moment someone runs something that does.
#
# Both point at FAC, not scratch: scratch is purged at 30 days (doc 02).
tool_exports() {
  echo "SIF_PROTENIX=\"$(_image_path)\""
  echo "PROTENIX_ROOT_DIR=\"$(_refdata protenix)\""
  echo "PROTENIX_DATA_ROOT_DIR=\"$(_refdata protenix)/data\""
}

tool_doctor() {
  _r="$(_refdata protenix)"
  [ -d "$_r" ] || { echo "no PROTENIX_ROOT_DIR at $_r -- on the LOGIN node: tools/protenix/fetch-weights.sh"; return 1; }

  # A checkpoint, and specifically a v1 one. Counting files is not enough:
  # the failure this entry exists to prevent is a v2 checkpoint appearing on
  # the share because someone read the model table and picked the best row.
  _ck="$_r/checkpoint"
  _n=$(find "$_ck" -type f -name '*.pt' 2>/dev/null | wc -l)
  [ "$_n" -ge 1 ] || { echo "no checkpoint under $_ck -- on the LOGIN node: tools/protenix/fetch-weights.sh"; return 1; }
  _v2=$(find "$_ck" -type f -name '*v2*' 2>/dev/null | head -1)
  [ -z "$_v2" ] || { echo "PROPRIETARY v2 checkpoint on the share: $_v2 -- its weights carry no open-source licence and restrict the outputs. Remove it; this entry is v1 only."; return 1; }

  # The CCD is what lets Protenix resolve ligand chemistry. A weights-only
  # cache looks complete right up until the first fold with a hapten in it --
  # the same shape as boltz's mols.tar trap.
  _ccd=$(find "$_r/common" -type f 2>/dev/null | wc -l)
  [ "$_ccd" -ge 1 ] || { echo "checkpoint present but $_r/common is empty -- no CCD, so every ligand fold fails. Re-run tools/protenix/fetch-weights.sh"; return 1; }

  # Probe the image rather than assume, the way boltz's doctor does. This
  # recipe installs a C compiler on purpose (see the .def); if a future
  # rebuild slims the base and drops it, any JIT kernel path dies at first use
  # having written nothing, and nothing else would notice.
  _cc="compiler ok"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || _cc="NO C COMPILER in the image -- any JIT-compiled kernel path dies at first use, mid-run, having written nothing"
  else
    _cc="compiler unchecked (no apptainer here)"
  fi

  _g="GPU_MAX_CC $GPU_MAX_CC"
  case "$GPU_MAX_CC" in
    UNMEASURED) _g="GPU_MAX_CC UNMEASURED -- chpc-tool exec will refuse on every GPU node until it is measured; see tool.conf" ;;
  esac
  echo "root $_r, $_n checkpoint(s); $_cc; $_g"
}
