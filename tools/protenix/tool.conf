# Protenix -- AlphaFold3-class structure prediction, PINNED AT v1 ON PURPOSE.
#
# v2 exists, is newer and is larger (464 M vs 368 M parameters). Its WEIGHTS
# are released under no open-source licence at all -- upstream's own words are
# "proprietary and confidential information of the rights holder ... may not be
# reproduced, distributed, sublicensed, disclosed, or otherwise transferred to
# any third party in any form without the express prior written consent of the
# rights holder". The v1 weights, and all of the code, are Apache-2.0 and free
# for commercial use.
#
# This is a therapeutic programme. alphafold3's entry in this registry already
# records what that costs: a weights licence restricts the OUTPUTS, and a
# structure that enters a filing or a partnership is the part that gets asked
# about years after the run. Protenix v1 is the version that does not have that
# problem, so VERSION is 1 and the checkpoint name is pinned below. Do not
# "upgrade" this entry to v2 -- that is a new entry, with a new licence
# conversation, or it is nothing.
NAME=protenix
VERSION=1
KIND=container
# STATUS=planned: nothing is built and nothing has been run. The registry's
# ladder is planned -> built -> verified, and the middle rung matters here
# because a container that starts and cannot find its weights looks identical
# to a working one until real work is submitted. Do not flip this past
# `built` until test.sh passes on a compute node.
# built 2026-09-25, after four separate defects in this recipe: a base with
# no nvcc for an extension protenix compiles AT IMPORT, an unpinned install
# that resolved 2.0.0 (the generation whose weights this entry forbids), a
# missing ninja, and /opt/venv/bin absent from PATH during %post so torch
# could not run the ninja it had. NOT `verified`: test.sh has not run on a
# compute node.
#
# protenix_2 rebuilt 2026-09-24 for TEMPLATES: kalign 3.4.0 built from source
# (no Ubuntu package exists), plus two recorded patches making the hard-coded
# inference template cutoff and fetch_remote into config keys whose defaults
# are the values they replaced. Validated on the login node against the tool's
# own featurizer: with the cutoff at its default a 2024 template yields 0
# features and warnings; with PROTENIX_MAX_TEMPLATE_DATE=3000-01-01 the same
# input yields features and no warnings.
#
# VERIFIED 2026-09-25: SLURM 1986816, ggpu1-09, NVIDIA L40S (compute capability
# 8.9), 140 s, exit 0. Three cases:
#   1. a 31-mer folds: 31 CA atoms, CA radius of gyration 12.95 A.
#   2. a DECLARED COVALENT BOND lands where it was declared. SG-C1 at 1.68 A,
#      one ligand contact inside 2.10 A, furthest ligand atom 5.28 A, and the
#      bonded carbon's single heavy neighbour is C2 -- a terminal Michael
#      acceptor CH2 by connectivity, which needs no atom names to be true.
#   3. the template date gate MOVES, in both directions: at the default cutoff
#      (2021-09-30) a 2024 structure is rejected, and with
#      PROTENIX_MAX_TEMPLATE_DATE=3000-01-01 the same structure is accepted.
#      kalign 3.4.0 answers on the path configs_data.py points at.
#
# The first attempt at this (SLURM 1986556) had to be cancelled after thirteen
# minutes and is worth recording rather than forgetting: test.sh omitted
# --use_msa false, so protenix went looking for protenix-server.com through
# the site proxy from a node with no route out, and retried FOREVER -- the
# message is `Retrying... (1/5)` every five seconds and the counter never
# advances, because the 5 is a per-call budget inside a loop that re-enters.
# It would have consumed the whole four-hour allocation. Fixed in test.sh.
STATUS=verified
LICENSE="code Apache-2.0; v1 model parameters Apache-2.0, commercial use permitted. v2 weights are PROPRIETARY, released under no open-source licence -- never stage them here."
UPSTREAM=https://github.com/bytedance/Protenix
UPSTREAM_REF="protenix==1.1.0"   # pinned in the .def; PyPI 2.0.0 is the v2 generation
NOTE="Pinned at v1 for the LICENCE, not for the science: v2 weights are proprietary and restrict the outputs, which for a therapeutic programme outlives the run (see alphafold3's entry). Covalent bonds are a top-level covalent_bonds list of {entity1,copy1,position1,atom1,entity2,copy2,position2,atom2}; ENTITIES ARE REFERENCED BY 1-BASED POSITION IN THE sequences LIST, NOT BY CHAIN ID, which is the opposite of the AlphaFold-3 convention every other tool here uses -- reorder the sequences list and every bond silently moves. A SMILES ligand's atoms are NAMED by protenix itself as element plus a 1-based per-element ordinal in RDKit atom order -- json_parser.py builds f'{element}{count}' -- so 'C3' and 'N2' are real atom names and are the same vocabulary this project calls smiles_order. USE THAT FORM. An INTEGER endpoint is the trap, and it is worse than previously recorded here: it is not simply a 0-based index. json_to_feature.py resolves an int through entity_dict['atom_map_to_atom_name'], which json_parser.py keys by RDKit ATOM MAP NUMBER when the SMILES carries explicit maps like [C:7], and by 0-based atom INDEX only when it carries none. One integer, two bases, chosen by whether the SMILES text happens to contain a colon -- which is exactly how a plausible structure gets its bond on the wrong atom. Pass names, never integers. Precomputed MSAs go in via pairedMsaPath and unpairedMsaPath and upstream recommends ABSOLUTE paths; a compute node has no internet, so MSA generation is a login-node stage, never a flag on the fold. GPU_MAX_CC is 9.0, measured in the built image with torch._C._cuda_getArchFlags(). MEASURED 2026-09-25 on the first build attempt: this tool JIT-COMPILES A CUDA EXTENSION AT IMPORT, unconditionally and with no fallback path -- protenix/model/layer_norm/layer_norm.py compiles layer_norm_cuda_kernel.cu the first time the model modules are imported -- so the image needs NVCC, not merely a C compiler, and a -slim base produces an image whose plain 'import protenix' succeeds and which dies on the first real job. TEMPLATES, measured in protenix_1.sif and fixed in protenix_2: per-chain templatesPath on a proteinChain pointing at an hmmsearch .a3m or hhsearch .hhr, plus --use_template. The a3m header must match ^>?([a-z0-9]+)_(\w+)/([0-9]+)-([0-9]+).*protein length:([0-9]+) and the description must contain 'mol:protein' -- pdb id LOWERCASE, which is the opposite of chai1's uppercase cif cache. Protenix DISCARDS the a3m's alignment and re-aligns with kalign against its own seqres, so the header ranges matter and the alignment columns mostly do not. mmCIFs resolve as \$PROTENIX_ROOT_DIR/mmcif/<pdbid>.cif. FOUR gates drop a hit and the fold still exits zero: (1) the PDB id is ABSENT from \$PROTENIX_ROOT_DIR/common/release_date_cache.json, reported as an ERROR 'date unknown' and checked BEFORE the cutoff, so PROTENIX_MAX_TEMPLATE_DATE does not reach it -- and _parse_release_dates returns {} for a missing file without raising, so absent and empty are the same thing; (2) released after the cutoff, a WARNING, fixed by PROTENIX_MAX_TEMPLATE_DATE; (3) a hit whose ungapped sequence is a substring of the query covering >95% of it, a WARNING, so a target's own reference structure cannot template it at all; (4) a hit under 10 residues, a WARNING, so shorter peptide templates are dropped. MEASURED 2026-09-25: cache absent -> 0 features whatever the cutoff; cache present with real 2024 dates + default cutoff -> 0 features; cache present + 3000-01-01 -> 3 features. BOTH fixes are needed. MEASURED 2026-09-25 by re-running fetch-weights.sh: --use_template true DOES download both files, and the shared root now carries them plus an empty mmcif/. The cache is NOT, as previously recorded here, a v1-era snapshot that cannot hold a post-cutoff entry -- it holds 219,912 entries dated 1976-05-19 to 2024-05-22, of which 37,540 are AFTER the 2021-09-30 cutoff; the cutoff is a filter applied at inference, not a property of the file. What it is, is a SNAPSHOT THAT ENDS 2024-05-22, so a template released after that date is absent and reads as 'date unknown'. That is why all four entries this project templates on (8UDR 2024-10-16, 8VR9/8VRA/8VRB 2024-09-04) still need a per-run overlay, and why a structure released BETWEEN the cutoff and the snapshot does not. For anything newer than the snapshot the date must be read from _pdbx_audit_revision_history in the deposited mmCIF itself (the 'Structure model' 1.0 row; the loop's FIRST row is the DEPOSITION date, wrong by 13 months for 8UDR). Max 4 templates per chain at inference, AFTER de-duplication BY SEQUENCE -- three structures of one complex are one template here and three for boltz2, so a set's member count does not transfer between tools. AND: ALWAYS RUN WITH \`< /dev/null\` WHEN TEMPLATES ARE ON. protenix/data/tools/kalign.py Popens kalign without setting stdin, kalign 3 reads stdin even with -i, so an inherited open pipe makes it block in pipe_read FOREVER at 0% CPU -- measured, three minutes with no output, and it would have burned the whole allocation. Invisible from a tty (EOF) and from sbatch (/dev/null); it bites wrapper scripts, pipelines and \`ssh host cmd\`."

IMAGE=protenix_2.sif
GPU=1
# Where the installation lives inside the image. /opt/venv, not /opt/protenix:
# the recipe installs into a virtual environment because ubuntu24.04 marks its
# interpreter externally managed, and %environment puts /opt/venv/bin on PATH.
APPDIR=/opt/venv
# A console script. CONFIRMED against protenix 1.1.0's own click group rather
# than copied from a README:
#
#   protenix pred -i in.json -o out -s <seeds> -e <samples> -n <model>
#
# SAMPLING DEFAULTS, read from the built image's own --help 2026-09-25:
#   -s/--seeds 101   -c/--cycle 10   -p/--step 200   -e/--sample 5   -d bf16
# `-e` is samples PER SEED, so `-s 1,2 -e 5` is ten structures. Protenix writes
# them as <name>_sample_<i>.cif in SAMPLE order -- there is no ranking in the
# filename, unlike boltz, which sorts on confidence_score and writes the best
# as _model_0. Read the per-sample <name>_summary_confidence_sample_<i>.json to
# rank; taking sample_0 as "the prediction" is taking an arbitrary draw.
#
# --use_default_params IS A NO-OP FOR THIS ENTRY and that is worth writing down
# rather than leaving as a flag someone adds hoping for better numbers.
# runner/batch_inference.py:815 sets cycle=10 and step=200 for the four
# base/default checkpoints -- which is exactly what the CLI already defaults to
# -- and only the mini/tiny models get different values (cycle=4, step=5, and
# the ESM/ISM minis additionally turn MSA off). Upstream's own docs/ says the
# flag defaults to true; in this pinned wheel the click default is False. Both
# readings fold identically on protenix_base_default_v1.0.0.
#
# The subcommand is `pred`, not `predict` -- `predict` is the function and
# `add_command(predict, name="pred")` is the registration. The default
# --model_name is protenix_base_default_v1.0.0, which is the v1 checkpoint this
# entry is pinned to; name it explicitly anyway, because a default is exactly
# how the wrong generation would arrive quietly.
ENTRY=protenix

# GPU_MAX_CC -- the highest compute capability this image has kernels for.
#
# NOT MEASURED, because nothing has been built, and a number invented here is
# worse than no entry: the gpu partition is three devices (L40S 8.9, H100 NVL
# 9.0, RTX PRO 6000 Blackwell 12.0), a bare --gres=gpu:1 lands on any of them,
# and five tools in this registry already declare 9.0 and die on the Blackwell
# nodes with an error that reads like a broken install (doc 05).
#
# The literal value below is deliberate and it FAILS CLOSED. chpc-tool compares
# with awk (`a+0 > b+0`), and awk reads a non-numeric string as 0, so every
# device is "above" this ceiling and `chpc-tool exec protenix` refuses on any
# GPU node until a real number replaces it. That is the right behaviour while
# the answer is unknown: refusing is recoverable, a wrong ceiling is a job that
# dies twenty minutes in.
#
# Measure it INSIDE the built image, on the LOGIN NODE -- _cuda_getArchFlags
# needs no GPU and no nvidia-smi, which is why the guard above cannot get in
# its own way there:
#
#   /usr/bin/apptainer exec "$CHPC_CONTAINERS/protenix_1.sif" \
#     python -c "import torch; print(torch._C._cuda_getArchFlags())"
#
# The highest sm_NN in that list is the number: sm_120 -> 12.0, sm_90 -> 9.0.
#
# What the FAILED first build printed, for whoever measures it properly: with
# the unpinned install (protenix 2.0.0, torch 2.7.1+cu126) the flags were
#     sm_50 sm_60 sm_70 sm_75 sm_80 sm_86 sm_90
# -- no sm_120, so L40S or H100 and never a bare --gres=gpu:1. That is NOT
# copied into the field below, because it was measured on a different pinned
# version than this entry now installs. Re-measure on the 1.1.0 image.
# Use _cuda_getArchFlags, NOT torch.cuda.get_arch_list(), which returns [] with
# no GPU visible -- precisely the situation you are in on the login node.
# protenix_1.def prints a candidate at the end of %post; that is the same
# measurement, taken at build time, and it still has to be copied here by hand.
# MEASURED 2026-09-25 in the built image, on the login node, on the PINNED
# version (protenix 1.1.0, torch 2.7.1+cu126):
#     arch flags sm_50 sm_60 sm_70 sm_75 sm_80 sm_86 sm_90
# No sm_120, so ask for --gres=gpu:nvidia_l40s:1 or an H100 -- or exclude
# ggpu1-[13-19] by name, which keeps both eligible and is what this project's
# job scripts do.
GPU_MAX_CC=9.0
# WHERE THIS HAS ACTUALLY RUN. GPU_MAX_CC above is a ceiling and admits
# nvidia_h100_nvl at cc 9.0 as well; this records what has been exercised, and
# only the L40S has been. 300 production folds on 2026-09-26, all exit 0, every
# one of them on an L40S. Opening resources.gpu_model beyond this class is
# permitted by the ceiling and unevidenced by the record -- `h8 doctor --group
# cluster` says so, and `chpc-tool test protenix` under
# --gres=gpu:nvidia_h100_nvl:1 is what would turn it into a measurement.
GPU_TESTED=nvidia_l40s

# PROTENIX_ROOT_DIR is where Protenix puts its checkpoints ($ROOT/checkpoint)
# and the chemical component dictionary ($ROOT/common). It defaults to the
# user's HOME, which is wrong twice over on this cluster: HOME is small, and
# the first job on a compute node would try to download from a node with no
# internet. PROTENIX_DATA_ROOT_DIR is the separate training/preprocessed-data
# root; inference does not need it, but naming it stops it defaulting into HOME
# the moment someone runs something that does.
#
# Both point at FAC, not scratch: scratch is purged at 30 days (doc 02).
tool_exports() {
  echo "SIF_PROTENIX=\"$(_image_path)\""
  echo "PROTENIX_ROOT_DIR=\"$(_refdata protenix)\""
  echo "PROTENIX_DATA_ROOT_DIR=\"$(_refdata protenix)/data\""
}

tool_doctor() {
  _r="$(_refdata protenix)"
  [ -d "$_r" ] || { echo "no PROTENIX_ROOT_DIR at $_r -- on the LOGIN node: tools/protenix/fetch-weights.sh"; return 1; }

  # A checkpoint, and specifically a v1 one. Counting files is not enough:
  # the failure this entry exists to prevent is a v2 checkpoint appearing on
  # the share because someone read the model table and picked the best row.
  _ck="$_r/checkpoint"
  _n=$(find "$_ck" -type f -name '*.pt' 2>/dev/null | wc -l)
  [ "$_n" -ge 1 ] || { echo "no checkpoint under $_ck -- on the LOGIN node: tools/protenix/fetch-weights.sh"; return 1; }
  _v2=$(find "$_ck" -type f -name '*v2*' 2>/dev/null | head -1)
  [ -z "$_v2" ] || { echo "PROPRIETARY v2 checkpoint on the share: $_v2 -- its weights carry no open-source licence and restrict the outputs. Remove it; this entry is v1 only."; return 1; }

  # The CCD is what lets Protenix resolve ligand chemistry. A weights-only
  # cache looks complete right up until the first fold with a hapten in it --
  # the same shape as boltz's mols.tar trap.
  _ccd=$(find "$_r/common" -type f 2>/dev/null | wc -l)
  [ "$_ccd" -ge 1 ] || { echo "checkpoint present but $_r/common is empty -- no CCD, so every ligand fold fails. Re-run tools/protenix/fetch-weights.sh"; return 1; }

  # Probe the image rather than assume, the way boltz's doctor does. This
  # recipe installs a C compiler on purpose (see the .def); if a future
  # rebuild slims the base and drops it, any JIT kernel path dies at first use
  # having written nothing, and nothing else would notice.
  _cc="compiler ok"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || _cc="NO C COMPILER in the image -- any JIT-compiled kernel path dies at first use, mid-run, having written nothing"
  else
    _cc="compiler unchecked (no apptainer here)"
  fi

  _g="GPU_MAX_CC $GPU_MAX_CC"
  case "$GPU_MAX_CC" in
    UNMEASURED) _g="GPU_MAX_CC UNMEASURED -- chpc-tool exec will refuse on every GPU node until it is measured; see tool.conf" ;;
  esac
  echo "root $_r, $_n checkpoint(s); $_cc; $_g"
}
