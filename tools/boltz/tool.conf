# Boltz-2 -- structure prediction / restrained refinement. See README.md.
#
# Named `boltz` rather than `boltz2` to match the tool's own CLI and the
# logical name the pipelines already use; VERSION carries the 2.
NAME=boltz
VERSION=2
KIND=container
# Verified 2026-09-19 on an H100 NVL (cc 9.0): folded a 31-residue peptide,
# 31 CA atoms, CA spread 12.92 A. That run is what proves the [cuda] extra --
# a bare `pip install boltz` passes %post, %test and --help and then dies
# mid-batch on ModuleNotFoundError: cuequivariance_torch. See README.md.
#
# That 31-mer was TOO SMALL to prove the kernels work. Measured 2026-09-22 on
# an L40S: 31 aa and 71 aa predict fine with the kernels on, while 142 aa
# fails, and so does every larger input -- one chain or two, the boundary is
# total token count and lies between 71 and 142. So the self-test passed while
# every real job died. test.sh now carries a second case above that boundary.
#
# boltz_2_gcc REBUILT 2026-09-25 to add a C compiler, so Triton can build the
# cuequivariance kernels and no fold needs --no_kernels. STATUS dropped back to
# `built` because that is the registry ladder and this is a different image:
# boltz_2.sif was verified, boltz_2_gcc.sif is not yet. Both .def files are
# kept -- boltz_2.def is what every Boltz-2 number this project holds was
# produced with.
#
# THREE THINGS MUST BE MEASURED BEFORE THIS SAYS verified AGAIN, and the first
# two have never been possible before, because no image that could compile the
# kernels existed:
#   1. test.sh case 2 (213 aa, kernels ON) passes at all. On boltz_2.sif it
#      fails, which is why that image is `verified` with a test that does not
#      pass -- the case was added after the qualification it postdates.
#   2. THE KERNEL PATH ON BLACKWELL. The "any gpu node" claim below rests on
#      job 1899088 on ggpu1-19, which folded a 31-MER -- below the boundary,
#      so it never reached a Triton kernel. torch's arch flags carry sm_120;
#      whether the cuequivariance Triton kernels compile there is UNKNOWN and
#      must not be inferred from them. Run case 2 on
#      --gres=gpu:nvidia_rtx_pro_6000:1 before trusting a bare --gres=gpu:1.
#      If it fails, this entry gains its first GPU_MAX_CC and boltz stops being
#      the tool that runs anywhere.
#   3. The speedup, against the measured baseline. Job 1986189, L40S, the full
#      658-token covalent complex at 5 diffusion samples: 240 s wall with
#      --no_kernels. Kernels on is a DIFFERENT COMPUTATION, not a faster one --
#      it rides in this project's computation_digest -- so the number is worth
#      having before anything is re-folded against it.
STATUS=built
LICENSE=MIT
UPSTREAM=https://github.com/jwohlwend/boltz
UPSTREAM_REF=boltz==2.2.1
NOTE="The cuequivariance kernels are ON by default and are Triton, which JIT-compiles them at first use and so needs a C compiler INSIDE the image. boltz_2_gcc.sif HAS one; boltz_2.sif did not, and on it any prediction above ~128 total tokens died in four seconds with 'Failed to find C compiler' having written nothing -- if you are pinned to that image, or to any -slim rebuild, pass --no_kernels, which costs speed only. TRITON_CACHE_DIR is set to /tmp/triton-cache in %environment and that matters under an array: the default is ~/.triton/cache, one directory on a 20 GiB shared home that every concurrent task writes into, and /tmp is node-local so eight tasks on one node compile once between them. THE KERNEL PATH HAS NEVER RUN ON BLACKWELL -- the sm_120 measurement behind 'any gpu node' (job 1899088, ggpu1-19) folded a 31-mer, which is below the size that reaches a kernel at all, so it measured torch and not cuequivariance. Until test.sh case 2 passes on --gres=gpu:nvidia_rtx_pro_6000:1, treat a bare --gres=gpu:1 with kernels ON as unproven on seven of the partition's nodes. BOLTZ_CACHE must be ABSOLUTE -- boltz resolves --cache relative to the working directory, so a job that cd's elsewhere silently uses a different, empty cache. --use_msa_server queries a REMOTE server a compute node cannot reach: precompute MSAs on the login node or supply them. Do NOT rank peptide substrates with the affinity head; it is ligand-only and capped at 128 atoms. Boltz renumbers every chain from 1 and its constraint references are 1-based offsets into the sequence you supply -- map back to EU numbering explicitly."

# SAMPLING DEFAULTS, read from the built image's click parameters 2026-09-25
# (not from --help, which disagrees with itself: the help string for
# --subsample_msa says "Default is True" while the parameter default is False):
#   recycling_steps 3   sampling_steps 200   diffusion_samples 1
#   step_scale None (the model picks: 1.638 for boltz1, 1.5 for boltz2)
#   seed None -- NO SEEDING AT ALL unless --seed is passed
#   max_msa_seqs 8192   subsample_msa False   max_parallel_samples 5
#
# --use_potentials is OFF by default and upstream asks for it: docs/prediction.md
# says it "significantly improve[s] the physical quality of the poses". Measured
# on the p1b7_8udr benchmark: it moves the covalent SG-to-warhead distance from
# 1.21-1.44 A to 1.36-1.72 A against 1.76 A in the deposited complex, and does
# NOT move the dock (MHC/VH DockQ 0.025-0.026 either way). It is a BIAS, not a
# guarantee: two of the eight potentials-on draws measured so far were BELOW the
# covalent floor (0.81 A, and 1.359 A in job 1986189) -- physically impossible
# separations that ipTM rated 0.86-0.89. Check the geometry of every draw you
# intend to keep, not only the one boltz ranked first.
#
# QUALIFIED 2026-09-25, job 1986189 on an L40S: the full covalent peptide-MHC
# plus Fv (658 tokens) at --use_potentials --no_kernels --diffusion_samples 5
# --recycling_steps 3 --sampling_steps 200 --seed 1, MSAs from disk, container
# under --net --network none. 240 s wall, 5 models, exit 0. Potentials and
# --no_kernels do NOT conflict. --output_format pdb PRESERVES the covalent
# bond: the written PDB carries 46 connectivity records and the SG-C25 bond is
# one of them, so a PDB-only pipeline does not lose the chemistry.
#
# diffusion_samples 1 is the outlier among the tools in this registry: chai1,
# protenix and alphafold3 all default to 5, as does boltz's OWN affinity head.
# Output IS ranked -- data/write/writer.py sorts on confidence_score descending
# and writes the best as <name>_model_0 -- so raising it improves the model you
# keep, not just the ensemble. Upstream names the AlphaFold-3-parity setting as
# `--recycling_steps 10 --diffusion_samples 25`, noting it is much slower; the
# recycling half of that was measured here and changed nothing (0.025-0.026).
IMAGE=boltz_2_gcc.sif
GPU=1
APPDIR=/opt/boltz
ENTRY=boltz                 # a console script, not a python module

# Boltz downloads its weights on first use. HF_HOME and TORCH_HOME are pointed
# at user scratch by chpc.env, which is right for a cache and wrong for the
# only copy -- scratch is purged. BOLTZ_CACHE pins them to FAC instead.
tool_exports() {
  echo "SIF_BOLTZ=\"$(_image_path)\""
  echo "BOLTZ_CACHE=\"$(_refdata boltz)\""
}

tool_doctor() {
  _c="$(_refdata boltz)"
  [ -d "$_c" ] || { echo "no weight cache at $_c -- fetch once, on the login node: tools/boltz/fetch-weights.sh"; return 1; }

  # The cuequivariance kernels are ON by default (main.py: use_kernels = not
  # no_kernels) and they are Triton, which JIT-COMPILES them at first use. That
  # needs a C compiler INSIDE the image, at RUN time, on the compute node. Any
  # prediction big enough to reach the kernel path without one dies with
  #   RuntimeError: Failed to find C compiler.
  # from triton/runtime/build.py, four seconds in, having written nothing.
  #
  # FAILED now, not merely reported. It used to be reported, and that was the
  # right call for boltz_2.sif: a caller could pass --no_kernels and get work
  # done, so the tool worked with a caveat. boltz_2_gcc.sif exists SOLELY to
  # carry the compiler, so a build of it without one is not a caveat, it is an
  # image that is not what its name says. A path check cannot see any of this,
  # which is the whole point of doctor.
  #
  # A compiler alone is still not sufficient and this probe does not pretend
  # otherwise: Triton compiles its launcher against Python.h and links it
  # against libcuda, so headers and the driver stub matter too. %post asserts
  # the headers by building a real shared object; libcuda only exists on a GPU
  # node, so test.sh is what settles that half.
  _k="kernels ok (cc present)"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || { echo "NO C COMPILER in $(_image_path): Triton cannot build the cuequivariance kernels. This image is named for having one. Either rebuild it (chpc-tool build boltz, which now pairs the .def with IMAGE), or point at boltz_2.sif and pass --no_kernels."; return 1; }
    # /tmp/triton-cache, not ~/.triton/cache. The default is one directory on a
    # 20 GiB shared home that every concurrent array task writes into at once;
    # the gpu partition allows 8 GPUs per user and array tasks count
    # individually, so that is the normal case rather than the edge one.
    apptainer exec "$(_image_path)" sh -c 'test -n "${TRITON_CACHE_DIR:-}"' >/dev/null 2>&1 \
      || _k="cc present, but TRITON_CACHE_DIR is unset in the image -- Triton will JIT into ~/.triton/cache, on a shared quota, from every array task at once"
  else
    _k="kernels unchecked (no apptainer here)"
  fi
  echo "weight cache $_c; $_k"
}
