# Boltz-2 -- structure prediction / restrained refinement. See README.md.
#
# Named `boltz` rather than `boltz2` to match the tool's own CLI and the
# logical name the pipelines already use; VERSION carries the 2.
NAME=boltz
VERSION=2
KIND=container
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/jwohlwend/boltz
UPSTREAM_REF=boltz==2.2.1
NOTE="BOLTZ_CACHE must be ABSOLUTE -- boltz resolves --cache relative to the working directory, so a job that cd's elsewhere silently uses a different, empty cache. --use_msa_server queries a REMOTE server a compute node cannot reach: precompute MSAs on the login node or supply them. Do NOT rank peptide substrates with the affinity head; it is ligand-only and capped at 128 atoms. Boltz renumbers every chain from 1 and its constraint references are 1-based offsets into the sequence you supply -- map back to EU numbering explicitly."

IMAGE=boltz_2.sif
GPU=1
APPDIR=/opt/boltz
ENTRY=boltz                 # a console script, not a python module

# Boltz downloads its weights on first use. HF_HOME and TORCH_HOME are pointed
# at user scratch by chpc.env, which is right for a cache and wrong for the
# only copy -- scratch is purged. BOLTZ_CACHE pins them to FAC instead.
tool_exports() {
  echo "SIF_BOLTZ=\"$(_image_path)\""
  echo "BOLTZ_CACHE=\"$(_refdata boltz)\""
}

tool_doctor() {
  _c="$(_refdata boltz)"
  [ -d "$_c" ] || { echo "no weight cache at $_c -- fetch once on the login node, then chpc-assets install boltz"; return 1; }
  echo "weight cache $_c"
}
