# ColabFold -- AlphaFold2 with fast MMseqs2-based MSAs.
NAME=colabfold
VERSION=1.6.2
KIND=container
STATUS=verified
LICENSE=MIT
UPSTREAM=https://github.com/sokrypton/ColabFold
UPSTREAM_REF=ghcr.io/sokrypton/colabfold:1.6.2-cuda13
NOTE="Pull rather than build. AlphaFold2 weights are CC-BY-4.0 and usable commercially, unlike AlphaFold3. TWO things bite on a cluster: --data is mandatory (the default weights path is inside the read-only image), and the default MSA modes query a REMOTE server, which a compute node cannot reach -- precompute MSAs or pass --msa-mode single_sequence. As of the 1.6.2-cuda13 entry this RUNS ON sm_120 (Blackwell), measured on an RTX 5090 2026-11-03, so a bare --gres=gpu:1 is now correct for it. The 1.5.5 recipe is kept beside it and does NOT: its jaxlib enumerates a Blackwell device and then dies with CUDA_ERROR_INVALID_IMAGE on the first launch."
IMAGE=colabfold_1.6.2.sif
GPU=1
# Highest compute capability this image has kernels for. This entry is JAX,
# not torch, so the measurement is "jax enumerates the device AND a kernel
# actually launches" rather than an arch-flag string: jax 0.10.2 / jaxlib
# 0.10.2 in colabfold_1.6.2.sif returned a correct 512x512 matmul on an
# RTX 5090 (cc 12.0) on 2026-11-03. 12.0 is the highest device available to
# test, not a known ceiling. chpc-tool refuses a newer device up front, which
# is what blocked even weight DOWNLOADS under the old 9.0 value.
GPU_MAX_CC=12.0
GPU_TESTED=nvidia_geforce_rtx_5090
ENTRY=colabfold_batch
tool_exports() {
  echo "SIF_COLABFOLD=\"$(_image_path)\""
  # The value for --data. colabfold.download.default_data_dir is
  # /cache/colabfold, inside the image, so this is not an optimisation:
  # without it colabfold tries to write parameters into a read-only squashfs.
  echo "COLABFOLD_DATA=\"$(_refdata colabfold)\""
}
tool_doctor() {
  _d="$(_refdata colabfold)"
  [ -d "$_d/params" ] || {
    echo "no AlphaFold2 parameters at $_d/params -- on the LOGIN node: tools/colabfold/fetch-weights.sh"
    return 1; }
  # colabfold_batch re-downloads unless its own completion marker is there,
  # so the presence of .npz files is not sufficient evidence.
  _m=$(find "$_d/params" -name 'download_*_finished.txt' 2>/dev/null | wc -l)
  [ "$_m" -ge 1 ] || {
    echo "$_d/params has no download_*_finished.txt marker; colabfold will try to re-download"
    return 1; }
  echo "AlphaFold2 parameters $_d/params"
}
