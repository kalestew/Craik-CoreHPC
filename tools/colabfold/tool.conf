# ColabFold -- AlphaFold2 with fast MMseqs2-based MSAs.
NAME=colabfold
VERSION=1.5.5
KIND=container
STATUS=verified
LICENSE=MIT
UPSTREAM=https://github.com/sokrypton/ColabFold
UPSTREAM_REF=ghcr.io/sokrypton/colabfold:1.5.5-cuda12.2.2
NOTE="Pull rather than build. AlphaFold2 weights are CC-BY-4.0 and usable commercially, unlike AlphaFold3. TWO things bite on a cluster: --data is mandatory (the default weights path is inside the read-only image), and the default MSA modes query a REMOTE server, which a compute node cannot reach -- precompute MSAs or pass --msa-mode single_sequence. cuda12.2 means NO sm_120: --gres=gpu:nvidia_l40s:1, never a bare --gres=gpu:1."
IMAGE=colabfold_1.5.5.sif
GPU=1
ENTRY=colabfold_batch
tool_exports() {
  echo "SIF_COLABFOLD=\"$(_image_path)\""
  # The value for --data. colabfold.download.default_data_dir is
  # /cache/colabfold, inside the image, so this is not an optimisation:
  # without it colabfold tries to write parameters into a read-only squashfs.
  echo "COLABFOLD_DATA=\"$(_refdata colabfold)\""
}
tool_doctor() {
  _d="$(_refdata colabfold)"
  [ -d "$_d/params" ] || {
    echo "no AlphaFold2 parameters at $_d/params -- on the LOGIN node: tools/colabfold/fetch-weights.sh"
    return 1; }
  # colabfold_batch re-downloads unless its own completion marker is there,
  # so the presence of .npz files is not sufficient evidence.
  _m=$(find "$_d/params" -name 'download_*_finished.txt' 2>/dev/null | wc -l)
  [ "$_m" -ge 1 ] || {
    echo "$_d/params has no download_*_finished.txt marker; colabfold will try to re-download"
    return 1; }
  echo "AlphaFold2 parameters $_d/params"
}
