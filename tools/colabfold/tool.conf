# ColabFold -- AlphaFold2 with fast MSAs.
NAME=colabfold
VERSION=1.5.5
KIND=container
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/sokrypton/ColabFold
NOTE="Pull rather than build: docs/07 already records the image URL, docker://ghcr.io/sokrypton/colabfold:1.5.5-cuda12.2.2. AlphaFold2 weights are CC-BY-4.0 and usable commercially, unlike AlphaFold3."
IMAGE=colabfold_1.5.5.sif
GPU=1
ENTRY=colabfold_batch
tool_exports() { echo "SIF_COLABFOLD=\"$(_image_path)\""; }
