# DSSP -- secondary structure assignment.
NAME=dssp
VERSION=2.2.1
KIND=module
# Verified on CoreHPC 2026-09-17: `module load Sali dssp/2.2.1` puts
# /mnt/software/sali/linux/x86_64/dssp-2.2.1/bin on PATH. Sali also ships
# dssp/2.0.4; 2.2.1 is the collection default.
# STATUS=verified 2026-09-26: test.sh passed on ccpu1-01. Nothing is built here
# -- the module is the install -- so `verified` means the module resolves and
# mkdssp answers from the coordinates it is given. See README.md.
STATUS=verified
LICENSE=BSD-2-Clause
UPSTREAM=https://github.com/PDB-REDO/dssp
UPSTREAM_REF="mkdssp 2.2.1, Sali module collection (not built here)"
NOTE="Already on the cluster in the Sali collection, so there is nothing to build. This entry exists so a project names dssp and gets it, instead of every script hardcoding a module load. The binary is mkdssp, not dssp."
MODULE="Sali dssp/2.2.1"
ENTRY=mkdssp
