# Chai-1 -- structure prediction. An INDEPENDENT check on Boltz-2 poses, which
# is the whole reason to carry both: two models agreeing is evidence, one model
# is a guess. Never a mutation oracle.
NAME=chai1
VERSION=1
KIND=container
STATUS=planned
LICENSE=Apache-2.0
UPSTREAM=https://github.com/chaidiscovery/chai-lab
NOTE="Second opinion on substrate and binder poses. Filter output on catalytic geometry, never on ipTM for substrates."
IMAGE=chai1_1.sif
GPU=1
ENTRY=chai-lab
tool_exports() { echo "SIF_CHAI1=\"$(_image_path)\""; }
