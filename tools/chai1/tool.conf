# Chai-1 -- structure prediction. An INDEPENDENT check on Boltz-2 poses, which
# is the whole reason to carry both: two models agreeing is evidence, one model
# is a guess. Never a mutation oracle.
NAME=chai1
VERSION=0.6.1
KIND=container
# chai1_2 rebuilt 2026-09-24 to add kalign, without which templates cannot run
# at all (chai_lab asserts on the binary). STATUS dropped back to `built`
# because that is the registry ladder: chai1_1 was verified, chai1_2 is a
# different image.
#
# VERIFIED 2026-09-25: SLURM 1986672, ggpu1-06, NVIDIA L40S (compute capability
# 8.9), 87 s, exit 0. Two cases, and the second is the one that earns the word.
#   1. a 31-mer folds: 31 CA records, CA radius of gyration 12.91 A.
#   2. a DECLARED COVALENT BOND lands where it was declared. SG-C1_1 at 1.83 A,
#      one ligand contact inside 2.10 A, furthest ligand atom 5.86 A, and the
#      bonded carbon's single heavy neighbour is C2_1 -- a terminal Michael
#      acceptor CH2 by connectivity, which needs no atom names to be true.
#      The ligand's heavy atoms came back as C1_1 C2_1 C3_1 O1_1 N1_1 C4_1:
#      element plus 1-based per-element ordinal in RDKit atom order, which is
#      the vocabulary every restraint this project renders addresses by name.
#
# Case 2 was added on the day of qualification, because case 1 alone cannot
# support the word. HA-ADAPT's entire chai1 corpus -- 1,726 results -- is
# quarantined over a bond that landed 13.59 A from the warhead, and case 1
# would have passed on every one of those structures. The atom-NAME assertion
# is separate from the geometry one on purpose: a rebuild can renumber a SMILES
# ligand's atoms without moving a single bond, and this project renders bonds
# by name.
STATUS=verified
LICENSE="Apache-2.0"        # code AND weights. The older non-commercial Chai
                            # Discovery Community License was replaced; checked
                            # against the repo's LICENSE file 2026-09-17.
UPSTREAM=https://github.com/chaidiscovery/chai-lab
UPSTREAM_REF=chai_lab==0.6.1
NOTE="Second opinion on substrate and binder poses. Filter output on catalytic geometry, never on ipTM for substrates. Pinned torch<2.7 means NO sm_120: ask for --gres=gpu:nvidia_l40s:1 or an H100/H200, never a bare --gres=gpu:1. TEMPLATES need kalign on PATH and chai1_1.sif did not have it: chai_lab's m8 hit parser asserts \`shutil.which(\"kalign\") is not None\`, so --template-hits-path parsed its file, staged its mmCIFs and then died. chai1_2 installs kalign 3.4.0 from Debian trixie. The major version matters in one direction: chai_lab runs \`kalign -i -o --nthreads 1\`, and kalign 2.04 -- bioconda's \`kalign\`, and the one inside colabfold_1.5.5.sif -- REJECTS --nthreads. 3.x also accepts the older \`-format fasta\` form, so it is a superset; never pin back to 2.x to match another entry. A failing kalign is SILENT: the wrapper returns None, the hit is dropped, the fold exits zero having used no templates. The m8 hit table is TAB-delimited with 13 columns and no header -- the restraints file next door is COMMA-delimited, which is the same tool using two delimiters. Max 4 templates per chain; it raises rather than truncating. subject_start/subject_end count MODELLED residues (the loader strips gaps out of gemmi's polymer sequence before slicing), and they are NOT free: chai_lab slices seq[start:end], REALIGNS that slice to the query with kalign, and then raises \`discrepant start/end indices\` unless the alignment consumes the slice from its first residue to its last. So the range is a fixpoint of kalign's own alignment. MEASURED 2026-09-24 on a three-member related set, 15 chain hits: 11 began at the first modelled residue and 4 did NOT -- kalign left the template's leading residue unaligned, and the obvious subject_start=1 made chai reject those four outright. Being rejected rather than silently dropped is the only good news on this surface; derive the span in THIS image, where kalign is, and hand it to the renderer."
# SAMPLING DEFAULTS, read from the built image 2026-09-25 -- both the click
# CLI and run_inference's own signature, which agree:
#   num_trunk_recycles 3   num_diffn_timesteps 200   num_diffn_samples 5
#   num_trunk_samples 1    seed None                 low_memory True
#   use_esm_embeddings True            recycle_msa_subsample 0
# Upstream's README: "By default, the model generates five sample predictions"
# and MSAs are "recommend[ed] for improved performance".
#
# OUTPUT IS NOT RANKED. chai1.py writes pred.model_idx_<i>.cif at the raw
# SAMPLE index; StructureCandidates.sorted() exists but is not what lands on
# disk. The aggregate score is in scores.model_idx_<i>.npz, so ranking is the
# caller's job -- and pred.model_idx_0.cif is an arbitrary draw, NOT the best
# one. boltz is the opposite (data/write/writer.py sorts on confidence_score
# and writes the best as _model_0), so comparing "index 0" across the two tools
# compares a ranked best against a random sample.
IMAGE=chai1_2.sif
GPU=1
# Highest compute capability this image has kernels for, measured with
# torch._C._cuda_getArchFlags(). chpc-tool refuses a newer device up front.
GPU_MAX_CC=9.0
# WHERE THIS HAS ACTUALLY RUN. GPU_MAX_CC above is a ceiling and admits
# nvidia_h100_nvl at cc 9.0 as well; this records what has been exercised, and
# only the L40S has been. 300 production folds on 2026-09-26, all exit 0, every
# one of them on an L40S. Opening resources.gpu_model beyond this class is
# permitted by the ceiling and unevidenced by the record -- `h8 doctor --group
# cluster` says so, and `chpc-tool test chai1` under
# --gres=gpu:nvidia_h100_nvl:1 is what would turn it into a measurement.
GPU_TESTED=nvidia_l40s
ENTRY=chai-lab

# CHAI_DOWNLOADS_DIR must be set and must be writable. chai_lab defaults it to
# a directory inside its own site-packages, which is read-only in a squashfs
# image, so the first fold would fail trying to create it -- and on a compute
# node, which has no internet, it would fail trying to download in any case.
tool_exports() {
  echo "SIF_CHAI1=\"$(_image_path)\""
  echo "CHAI_DOWNLOADS_DIR=\"$(_refdata chai1)\""
}

tool_doctor() {
  _d="$(_refdata chai1)"
  [ -d "$_d" ] || { echo "no weight cache at $_d -- on the LOGIN node, run one small fold to populate it"; return 1; }
  [ -w "$_d" ] || { echo "$_d is not writable; chai writes there on first use"; return 1; }
  echo "weight cache $_d"
}
