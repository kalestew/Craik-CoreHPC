# Chai-1 -- structure prediction. An INDEPENDENT check on Boltz-2 poses, which
# is the whole reason to carry both: two models agreeing is evidence, one model
# is a guess. Never a mutation oracle.
NAME=chai1
VERSION=0.6.1
KIND=container
# chai1_2 rebuilt 2026-09-24 to add kalign, without which templates cannot run
# at all (chai_lab asserts on the binary). STATUS dropped back to `built`
# because that is the registry ladder: chai1_1 was verified, chai1_2 is a
# different image.
#
# VERIFIED 2026-09-25: SLURM 1986672, ggpu1-06, NVIDIA L40S (compute capability
# 8.9), 87 s, exit 0. Two cases, and the second is the one that earns the word.
#   1. a 31-mer folds: 31 CA records, CA radius of gyration 12.91 A.
#   2. a DECLARED COVALENT BOND lands where it was declared. SG-C1_1 at 1.83 A,
#      one ligand contact inside 2.10 A, furthest ligand atom 5.86 A, and the
#      bonded carbon's single heavy neighbour is C2_1 -- a terminal Michael
#      acceptor CH2 by connectivity, which needs no atom names to be true.
#      The ligand's heavy atoms came back as C1_1 C2_1 C3_1 O1_1 N1_1 C4_1:
#      element plus 1-based per-element ordinal in RDKit atom order, which is
#      the vocabulary every restraint this project renders addresses by name.
#
# Case 2 was added on the day of qualification, because case 1 alone cannot
# support the word. HA-ADAPT's entire chai1 corpus -- 1,726 results -- is
# quarantined over a bond that landed 13.59 A from the warhead, and case 1
# would have passed on every one of those structures. The atom-NAME assertion
# is separate from the geometry one on purpose: a rebuild can renumber a SMILES
# ligand's atoms without moving a single bond, and this project renders bonds
# by name.
STATUS=verified
LICENSE="Apache-2.0"        # code AND weights. The older non-commercial Chai
                            # Discovery Community License was replaced; checked
                            # against the repo's LICENSE file 2026-09-17.
UPSTREAM=https://github.com/chaidiscovery/chai-lab
UPSTREAM_REF="chai_lab==0.6.1, torch 2.7.0+cu128 forced past its <2.7 pin"
NOTE="Second opinion on substrate and binder poses. Filter output on catalytic geometry, never on ipTM for substrates. Pinned torch<2.7 means NO sm_120: ask for --gres=gpu:nvidia_l40s:1 or an H100/H200, never a bare --gres=gpu:1. TEMPLATES need kalign on PATH and chai1_1.sif did not have it: chai_lab's m8 hit parser asserts \`shutil.which(\"kalign\") is not None\`, so --template-hits-path parsed its file, staged its mmCIFs and then died. chai1_2 installs kalign 3.4.0 from Debian trixie. The major version matters in one direction: chai_lab runs \`kalign -i -o --nthreads 1\`, and kalign 2.04 -- bioconda's \`kalign\`, and the one inside colabfold_1.5.5.sif -- REJECTS --nthreads. 3.x also accepts the older \`-format fasta\` form, so it is a superset; never pin back to 2.x to match another entry. A failing kalign is SILENT: the wrapper returns None, the hit is dropped, the fold exits zero having used no templates. The m8 hit table is TAB-delimited with 13 columns and no header -- the restraints file next door is COMMA-delimited, which is the same tool using two delimiters. Max 4 templates per chain; it raises rather than truncating. subject_start/subject_end count MODELLED residues (the loader strips gaps out of gemmi's polymer sequence before slicing), and they are NOT free: chai_lab slices seq[start:end], REALIGNS that slice to the query with kalign, and then raises \`discrepant start/end indices\` unless the alignment consumes the slice from its first residue to its last. So the range is a fixpoint of kalign's own alignment. MEASURED 2026-09-24 on a three-member related set, 15 chain hits: 11 began at the first modelled residue and 4 did NOT -- kalign left the template's leading residue unaligned, and the obvious subject_start=1 made chai reject those four outright. Being rejected rather than silently dropped is the only good news on this surface; derive the span in THIS image, where kalign is, and hand it to the renderer."
# SAMPLING DEFAULTS, read from the built image 2026-09-25 -- both the click
# CLI and run_inference's own signature, which agree:
#   num_trunk_recycles 3   num_diffn_timesteps 200   num_diffn_samples 5
#   num_trunk_samples 1    seed None                 low_memory True
#   use_esm_embeddings True            recycle_msa_subsample 0
# Upstream's README: "By default, the model generates five sample predictions"
# and MSAs are "recommend[ed] for improved performance".
#
# OUTPUT IS NOT RANKED. chai1.py writes pred.model_idx_<i>.cif at the raw
# SAMPLE index; StructureCandidates.sorted() exists but is not what lands on
# disk. The aggregate score is in scores.model_idx_<i>.npz, so ranking is the
# caller's job -- and pred.model_idx_0.cif is an arbitrary draw, NOT the best
# one. boltz is the opposite (data/write/writer.py sorts on confidence_score
# and writes the best as _model_0), so comparing "index 0" across the two tools
# compares a ranked best against a random sample.
IMAGE=chai1_3.sif
GPU=1
# Highest compute capability this image has kernels for, measured with
# torch._C._cuda_getArchFlags(). chpc-tool refuses a newer device up front.
# 12.0 as of the chai1_3 image, 2026-11-03. MEASURED in the built image with
# torch._C._cuda_getArchFlags(): sm_75 sm_80 sm_86 sm_90 sm_100 sm_120
# compute_120, on torch 2.7.0+cu128. chai1_2 answered sm_50..sm_90 with NO
# compute_* entry at all, so it had neither kernels nor PTX for Blackwell --
# confirmed on an RTX 5090 2026-11-03, where a plain matmul in chai1_2.sif
# fails with `no kernel image is available for execution on the device`.
#
# CHEMISTRY CHECKED ON THE REAL TARGET, 2026-11-03, and it holds. Three
# covalent folds of the haptenated HLA-A*03:01/KRAS-G12C/sotorasib complex
# from this image, through the consuming project's own pipeline:
#
#   warhead  SG-C25   1.584  1.630  1.682 A
#   decoy    SG-C26  13.079 14.521 15.401 A
#
# The decoy column is the one that settles it. The 2026 contamination this
# entry's whole history turns on had those two numbers the other way round --
# bond on the aromatic ring carbon at 1.68 A with the warhead 13.59 A away --
# and ipTM moved only 0.710 -> 0.698 between right and wrong, so geometry is
# the only detector. Here the warhead is attached and the decoy sits 13-15 A
# off, which is the correct arrangement and matches the regression's own
# 12.5-15.3 A decoy band.
#
# Two of the three warhead distances fall just under the 1.636-1.770 A band
# the nine-fold regression established on an L40S under torch 2.6/cu124, by
# about 0.05 A. That is read as sampling spread rather than as a torch
# regression: Boltz-2 on this same target and host spans 1.094-1.975 A over
# 30 draws, and the target's MOV component declares no leaving atom, which is
# documented to place these bonds short. No draw approached the 5.0 A
# placement ceiling.
#
# THE REGISTRY TEST PASSES TOO, which is the cheaper check and a different
# one: `chpc-tool test chai1` on an RTX 5090 (cc 12.0), 2026-11-03 and again
# 2026-11-09, in ~51 s. 31 CA records with a 12.91 A CA spread; the declared
# SG-C1_1 bond at 1.84 A as the single contact within 2.10 A, furthest ligand
# atom 5.84 A, bonded carbon carrying exactly one neighbour; and the six
# ligand heavy atoms named C1_1 C2_1 C3_1 O1_1 N1_1 C4_1. Run this before a
# production round; run the chemistry check above when the TARGET changes.
#
# The atom-name assertion in that test is not decoration. This image suffixes
# every ligand atom with its entity copy, so the coordinator's committed
# mapping does not speak `C1_1` and an unnormalised claim reports
# `atom_not_in_vocabulary` on the decoy check -- which reads as "no collision
# here" and means "spelled differently". A silent pass on the decoy is the
# failure mode this entry exists to prevent, so the names are checked where
# they are produced.
#
# ONE THING THE TEST CANNOT CHECK, and it is not new. Chai-1 writes no
# _struct_conn at all, so the consuming project reports these folds as
# `bond_unverifiable: connectivity_not_recorded` -- the "the output declares
# this bond" check cannot run on Chai-1 output, by construction. The distances
# above are measured from coordinates, which is the only available evidence.
#
# ONE LATENT THING, measured 2026-11-09 and not a failure today. This image
# carries triton 3.3.0 and NO C compiler -- no cc, gcc, g++, clang or nvcc
# anywhere on PATH. Triton JIT-compiles its `cuda_utils` module at the first
# kernel launch by shelling out to one, and its wheels carry prebuilt kernels
# for sm_89 but none for sm_120, so on Blackwell that JIT path is the only
# path: `RuntimeError: Failed to find C compiler. Please specify via CC
# environment variable.` That is exactly how rfdiffusion3 died at 17 s on this
# host, after passing its own entry test.
#
# chai1 does not hit it. Eleven covalent folds of the real target on an RTX
# 5090 on 2026-11-09 and the registry test above, all fine -- so nothing on
# chai-lab's fold path compiles a Triton kernel as this image is built. It is a
# dependency, not a defect: an upstream release that starts using one, or a
# code path these folds do not take, fails at the FIRST KERNEL LAUNCH with that
# message and no other symptom.
#
# Not fixed by a rebuild here, and the reason is now a different one from the
# reason first written down. That reason was: container_digest feeds
# environment_fingerprint and so spec_id, so a chai1_4 image orphans every
# Chai-1 prediction banked against chai1_3. MEASURED IN THE CONSUMING PROJECT
# 2026-11-13 AND IT IS FALSE OF THE LIVE PATH. Its `h8 plan` built its tool spec
# as name plus `--tool-version`, which defaulted to the literal "0", and nothing
# filled in a container digest, resolved packages or weight digests. So a
# rebuild orphans nothing there -- and the hazard is the opposite one: chai1_3
# was itself rebuilt in place from an edited .def on 2026-11-09, same filename
# and same VERSION, and the folds from before and after that rebuild are
# indistinguishable in every identity that project records.
#
# DECIDED 2026-11-13, two parts:
#
#   1. `build-essential` lands with the NEXT rebuild of this entry for any other
#      reason, not as a rebuild of its own. The hazard is latent -- eleven
#      covalent folds of the real target and two registry tests pass on an RTX
#      5090 -- so a rebuild today buys nothing and spends the one thing a
#      rebuild costs: a corpus whose identity cannot tell it apart from the
#      corpus before it.
#   2. This entry should record a DIGEST of the built image, written by
#      `chpc-tool build`/`publish` where the image is produced, surfaced by
#      `chpc-tool show --env`, and read by a consumer into its own identity. That
#      is the field whose absence makes (1) a trade-off instead of a free fix:
#      with it, a rebuild is visible to a consumer's cache and a corpus knows
#      which image produced it. A digest recorded anywhere but at the build is
#      worse than none -- this workstation's copy of chai1_3.sif and the share's
#      are not known to be the same bytes, which is itself the argument.
#
# See the consuming project's ADR 0027, "The recipe that runs is part of the
# identity". `build-essential` in the def is still three lines.
GPU_MAX_CC=12.0
# WHERE THIS HAS ACTUALLY RUN. GPU_MAX_CC above is a ceiling and admits
# nvidia_h100_nvl at cc 9.0 as well; this records what has been exercised, and
# the H100 still has not been. Two classes have: 300 production folds on the
# L40S on 2026-09-26, all exit 0, and this workstation's RTX 5090 (cc 12.0) on
# 2026-11-03 via `chpc-tool test chai1` against the chai1_3 image.
# Opening resources.gpu_model to nvidia_h100_nvl is permitted by the ceiling
# and unevidenced by the record -- `h8 doctor --group cluster` says so, and
# `chpc-tool test chai1` under --gres=gpu:nvidia_h100_nvl:1 is what would
# turn it into a measurement. Note the two evidenced classes sit either side
# of it, so interpolating is a guess and not an inference.
GPU_TESTED=nvidia_l40s,nvidia_geforce_rtx_5090
ENTRY=chai-lab

# CHAI_DOWNLOADS_DIR must be set and must be writable. chai_lab defaults it to
# a directory inside its own site-packages, which is read-only in a squashfs
# image, so the first fold would fail trying to create it -- and on a compute
# node, which has no internet, it would fail trying to download in any case.
tool_exports() {
  echo "SIF_CHAI1=\"$(_image_path)\""
  echo "CHAI_DOWNLOADS_DIR=\"$(_refdata chai1)\""
}

tool_doctor() {
  _d="$(_refdata chai1)"
  [ -d "$_d" ] || { echo "no weight cache at $_d -- on the LOGIN node, run one small fold to populate it"; return 1; }
  [ -w "$_d" ] || { echo "$_d is not writable; chai writes there on first use"; return 1; }
  echo "weight cache $_d"
}
