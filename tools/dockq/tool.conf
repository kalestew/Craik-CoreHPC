# DockQ v2 -- how good is a predicted complex, against a reference.
#
# NOT A PREDICTOR. Everything else in this registry's co-folding family
# (boltz, chai1, protenix, intellifold, openfold3, alphafold3) produces
# structures; this one scores them against a native, which is the only way to
# say whether a predictor is any good on THIS kind of complex rather than on
# the PDB in general.
#
# CPU-only, and that is a fact about the tool, not an omission: there is no
# GPU= line set to 1 here, no GPU_MAX_CC, and nothing to measure. A 30-second
# scoring job that queues behind the gpu partition's 8-GPU, 21-job per-user cap
# would be an own goal -- send it to `cpu` or `community_short` (1 h, and it
# REQUIRES --qos=cmnt_short).
NAME=dockq
VERSION=2
KIND=container
# STATUS=planned: nothing is built and nothing has been run. `verified` means
# test.sh has passed, and test.sh here is deliberately not a self-comparison
# -- see the NOTE and test.sh itself.
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/bjornwallner/DockQ
UPSTREAM_REF=               # pin the exact pip version here when the image is built
NOTE="Scoring, not prediction: DockQ score, iRMSD, LRMSD, fnat, fnonnat, F1 and clashes, for protein multimers, nucleic acids and -- with --small_molecule -- small molecules. THE --mapping FLAG IS LOAD-BEARING. Model chains and native chains are different alphabets: a predictor emits A/B/C in its own order, a native from the PDB uses whatever the depositor chose, and DockQ will SEARCH chain permutations and report the best one it finds. A wrong mapping does not error -- it produces a plausible number. That is the whole failure mode: --mapping MODELCHAINS:NATIVECHAINS (wildcards allowed, e.g. A*:W*) pins it, and any pipeline that scores in bulk must pass it explicitly rather than trust the search. CAPRI thresholds, from upstream: below 0.23 Incorrect, 0.23-0.49 Acceptable, 0.49-0.80 Medium, 0.80 and above High quality. Cite Mirabello and Wallner, Bioinformatics 2024, doi 10.1093/bioinformatics/btae586."

IMAGE=dockq_2.sif
# CPU-only. GPU=0 is the default, and it is written out here so that nobody
# adds --nv to "match the other predictors" -- there is nothing to accelerate.
GPU=0
ENTRY=DockQ                 # capital D, capital Q; that is the console script

# No GPU_MAX_CC, on purpose.
#
# The other three entries added alongside this one carry GPU_MAX_CC=UNMEASURED,
# which fails closed until someone measures the image's arch flags. That field
# exists to stop a CUDA binary landing on a device it has no kernels for
# (doc 05). A CPU tool has no kernels, no device and no ceiling, so declaring
# one would be noise -- and chpc-tool only consults it when GPU=1 anyway.

# No fetch-weights.sh either, and no assets.tsv. DockQ has no weights: it is
# arithmetic over two structure files. A script that fetches nothing would be a
# lie about the shape of the tool, and the next person to read the directory
# would go looking for the payload it implies. foldseek and mmseqs2 have the
# same shape for the same reason.
tool_exports() {
  echo "SIF_DOCKQ=\"$(_image_path)\""
}

tool_doctor() {
  # There is no weights directory, no licence file and no GPU to check, so the
  # only thing that can go wrong here is the image itself -- and "the .sif
  # exists" is already checked by the caller before this runs. Probe the
  # property that actually matters: that the console script is there and
  # answers. An image with a broken entry point passes every path test.
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c 'command -v DockQ >/dev/null 2>&1' >/dev/null 2>&1 \
      || { echo "no DockQ console script in the image (capital D, capital Q)"; return 1; }
    echo "DockQ present; CPU-only, no weights. Remember --mapping when scoring in bulk."
  else
    echo "CPU-only, no weights; entry point unchecked (no apptainer here)"
  fi
}
