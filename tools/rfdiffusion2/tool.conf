# RFdiffusion2.
NAME=rfdiffusion2
VERSION=2
KIND=container
# STATUS=planned, and the blocker is NOT the licence any more -- see below.
# What stands in the way is ~31 GiB of upstream artefacts, an unstated licence
# on the WEIGHTS specifically, and a PyRosetta question about upstream's own
# .sif. README.md has the whole picture; do not flip this to built until an
# actual design has run, because RFdiffusion2 emits poly-alanine backbones by
# design and an empty-looking result is indistinguishable from a broken one.
STATUS=planned
# CODE licence RESOLVED 2026-09-26, read from LICENSE.md at upstream HEAD:
# BSD 3-Clause, "Copyright (c) 2025, Institute for Protein Design, University
# of Washington". NO non-commercial or academic-only clause. This entry
# previously carried an empty LICENSE= and a NOTE saying to confirm it before
# any commercial use; that is now answered for the code.
#
# DO NOT CARRY RFdiffusion 1's TERMS ACROSS. RFdiffusion 1 is reported by
# GitHub as NOASSERTION / "Other" -- a different and more restrictive
# situation -- and the two entries exist separately for exactly this kind of
# reason.
LICENSE="code: BSD-3-Clause (Institute for Protein Design, UW), commercial use NOT restricted. WEIGHTS: no licence statement anywhere in the repo or docs -- UNRESOLVED, ask upstream before any commercial use"
UPSTREAM=https://github.com/RosettaCommons/RFdiffusion2
UPSTREAM_REF=
NOTE="Successor to RFdiffusion; separate entry because the weights and the CLI differ. FOUR THINGS TO KNOW BEFORE BUILDING THIS. (1) AN ALL-ALANINE OUTPUT IS CORRECT, NOT A BROKEN INSTALL: RFdiffusion2 emits a backbone only and renders the sequence as poly-alanine, and the sequence comes afterwards from LigandMPNN. A test asserting a non-alanine sequence would fail against a working install. (2) AN ORI HETATM TOKEN IS MANDATORY in the input PDB, or inference aborts with 'ORI HETATM token is required for centering input correctly'. It is RFdiffusion2-only and incompatible with RFdiffusion 1 inputs, so every structure has to be edited before use. (3) UPSTREAM'S OWN CONTAINER IS CAPPED AT sm_90, so it cannot run on the Blackwell nodes at all -- ask for nvidia_l40s or nvidia_h100_nvl, never a bare gpu:1. (4) config/inference/base.yaml ships a DEAD internal checkpoint path from the authors' cluster, so ckpt_path must always be passed explicitly or a config that names it used instead. Upstream says original RFdiffusion is still better for BINDER design, which is most of what this lab wants it for, so build rfdiffusion2 for atomic motif and active-site work rather than as a drop-in upgrade."

IMAGE=rfdiffusion2_2.sif
GPU=1
# The shipped container carries kernels for sm_50 through sm_90 only. Declared
# up front so `exec` refuses a Blackwell node instead of letting a job spend
# minutes loading weights to die on "no kernel image is available".
GPU_MAX_CC=9.0
APPDIR=/opt/RFdiffusion2
ENTRY=python
tool_exports() {
  echo "SIF_RFDIFFUSION2=\"$(_image_path)\""
  echo "RFDIFFUSION2_DIR=\"$APPDIR\""
  # Upstream's root paths.py resolves a REPO_ROOT placeholder and is imported
  # by name, so the repo root must be importable or every path resolves
  # literally as the string "REPO_ROOT/...".
  echo "PYTHONPATH=\"$APPDIR\${PYTHONPATH:+:\$PYTHONPATH}\""
  echo "RFDIFFUSION2_WEIGHTS=\"$(_refdata rfdiffusion2)\""
}

tool_doctor() {
  _w="$(_refdata rfdiffusion2)"
  [ -d "$_w" ] || { echo "no weights at $_w -- see README.md, ~2.7 GiB of checkpoints plus upstream's images"; return 1; }
  _n=0
  for _f in "$_w"/RFD_173.pt "$_w"/RFD_140.pt; do
    [ -s "$_f" ] && _n=$((_n + 1))
  done
  [ "$_n" -gt 0 ] || { echo "no RFD_173.pt or RFD_140.pt under $_w"; return 1; }
  echo "$_n of 2 diffusion checkpoints present at $_w; GPU_MAX_CC 9.0 (no Blackwell)"
}
