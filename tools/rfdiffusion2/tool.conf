# RFdiffusion2.
NAME=rfdiffusion2
VERSION=2
KIND=container
STATUS=planned
LICENSE=
UPSTREAM=https://github.com/RosettaCommons/RFdiffusion2
NOTE="Successor to RFdiffusion; separate entry because the weights and the CLI differ. Confirm the licence before any commercial use."
IMAGE=rfdiffusion2_2.sif
GPU=1
APPDIR=/opt/RFdiffusion2
ENTRY=python
tool_exports() {
  echo "SIF_RFDIFFUSION2=\"$(_image_path)\""
  echo "RFDIFFUSION2_DIR=\"$APPDIR\""
}
