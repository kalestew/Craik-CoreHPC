# OpenMM -- molecular dynamics, no licence to chase.
NAME=openmm
VERSION=8
# KIND=container, though the package is conda-forge's. Same reasoning as
# anarci: an env under $CHPC_USER_SCRATCH/envs is per-user and lives on
# scratch, which is purged at 30 days and wiped at quarterly maintenance. An MD
# engine the lab is meant to reach for belongs on FAC, built once.
KIND=container
# STATUS=verified 2026-09-27 on ggpu1-10 (NVIDIA L40S, driver 595.71.05), job
# 2007171, 7 s: `chpc-tool test openmm` PASSED. The CUDA platform registers, a
# Context builds so the kernels compiled against this driver, the harmonic bond
# is exactly 0.5 kJ/mol, and openmm.testInstallation finds Reference, CPU and
# CUDA all computing forces within tolerance (Reference vs CUDA 6.73e-06).
#
# It took three runs to get here and only the first was the image's fault, which
# it was not: the first FAILED on four AMD ROCm plugins that cannot load on an
# NVIDIA node, because the assertion demanded an empty failure list. The second
# never started -- the FAC share was down. This is the third.
STATUS=verified
LICENSE=MIT
UPSTREAM=https://openmm.org/
UPSTREAM_REF="conda-forge openmm 8.6.1, python 3.12, cuda-version 13"
NOTE="The unlicensed alternative to Amber for near-attack-fraction work. TWO THINGS ABOUT THE CUDA PLATFORM, BOTH OF WHICH LOOK LIKE SUCCESS. (1) An import NEVER fails on a broken CUDA install: openmm/__init__.py loads its plugins and swallows the errors, which are only retrievable through openmm.Platform.getPluginLoadFailures(). The symptom is 'There is no registered Platform called CUDA' with only Reference and CPU listed, at run time, in a job. (2) OpenMM falls back to the CPU platform SILENTLY if you do not name a platform, so an MD run that should have taken an hour takes a week and reports nothing wrong -- always pass Platform.getPlatformByName('CUDA') explicitly. Related: conda picks its CUDA build from the driver version, and the login node has no driver, so the build pins cuda-version=13 under CONDA_OVERRIDE_CUDA=13.2; upstream's FAQ names driverless login nodes as the common cause of CUDA_ERROR_UNSUPPORTED_PTX_VERSION. The image's %post therefore asserts only the payload, and test.sh asserts the platform on a GPU node."

IMAGE=openmm_8.sif
GPU=1
# ggpu1-06, 2026-09-27: the CUDA platform registered, a Context built, the
# harmonic bond came out at exactly 0.500000 kJ/mol, and openmm.testInstallation
# found all three platforms agreeing within tolerance.
# Re-run through `chpc-tool test` on ggpu1-10 once the share returned (job
# 2007171). The L40S alone -- GPU_MAX_CC=9.0 admits the H100 NVL too, and
# nothing has run on one.
GPU_TESTED=nvidia_l40s
# GPU_MAX_CC empty: openmm's CUDA platform compiles its kernels at run time
# from source rather than shipping fixed SASS, so there is no architecture list
# to exceed. That is the opposite of the torch images, and it is why the sm_120
# problem in doc 05 does not apply here.
GPU_MAX_CC=
APPDIR=/opt/env
ENTRY=python

tool_exports() {
  echo "SIF_OPENMM=\"$(_image_path)\""
  echo "OPENMM_PYTHON=\"$APPDIR/bin/python\""
}

tool_doctor() {
  # Nothing on the share. What can go wrong is an image that solved a CPU-only
  # openmm, which no path test and no import catches.
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" test -s "$APPDIR/lib/plugins/libOpenMMCUDA.so" \
      || { echo "no libOpenMMCUDA.so in the image -- this is a CPU-only openmm"; return 1; }
    _v=$(apptainer exec "$(_image_path)" python -c 'import openmm; print(openmm.__version__)' 2>/dev/null)
    [ -n "$_v" ] || { echo "openmm does not import inside the image"; return 1; }
    # Whether CUDA actually REGISTERS depends on the node, so report rather
    # than judge: absent here is correct on a login node and wrong in a job.
    _p=$(apptainer exec --nv "$(_image_path)" python -c \
        'import openmm; print(",".join(openmm.Platform.getPlatform(i).getName() for i in range(openmm.Platform.getNumPlatforms())))' 2>/dev/null)
    case "$_p" in
      *CUDA*) echo "openmm $_v; platforms $_p" ;;
      "")     echo "openmm $_v; CUDA plugin present, platforms unreadable here" ;;
      *)      echo "openmm $_v; platforms $_p -- no CUDA, which is EXPECTED off a GPU node" ;;
    esac
  else
    echo "openmm is in the image, nothing on the share; image unchecked (no apptainer here)"
  fi
}
