# OpenMM -- molecular dynamics, no licence to chase.
NAME=openmm
VERSION=8
KIND=conda
STATUS=planned
LICENSE=MIT
UPSTREAM=https://openmm.org/
NOTE="The unlicensed alternative to Amber for near-attack-fraction work. conda-forge ships CUDA builds, so this is an env rather than an image."
PREFIX=${CONDA_ENVS_PATH:-${CHPC_USER_SCRATCH:-/mnt/scratch/user/$USER}/envs}/openmm
tool_exports() { echo "OPENMM_PYTHON=\"$PREFIX/bin/python\""; }
