# AmberTools -- the OPEN SOURCE half of Amber: preparation and analysis.
NAME=ambertools
VERSION=26
KIND=container
STATUS=planned
LICENSE="GPL-3.0-or-later AND LGPL-3.0-or-later AND BSD-3-Clause AND MIT (conda-forge); no licence to obtain"
UPSTREAM=https://ambermd.org/
UPSTREAM_REF="conda-forge ambertools 26.0, python 3.12"
NOTE="A SEPARATE ENTRY FROM amber ON PURPOSE. Amber is two pieces with two licences: AmberTools is open source and this is it; the pmemd engine, including pmemd.cuda, needs a paid site licence and lives in the amber entry. Carried as one entry the free 90 percent waited on the paid 10 percent -- amber sat planned with a doctor that failed on a missing pmemd.cuda, so tleap and cpptraj were unavailable too. Provides tleap, antechamber, parmchk2, parmed, cpptraj, pdb4amber, MMPBSA and sander. THE COMBINATION THAT NEEDS NO LICENCE ANYWHERE: parameterise here with tleap and antechamber, integrate on a GPU with the openmm entry, which reads Amber prmtop/inpcrd directly, then analyse the trajectory back here with cpptraj. sander IS included and will run MD, but it is CPU-only and far slower than pmemd.cuda, so it is for short equilibration and testing rather than production. TLEAP FAILS BY SUCCEEDING: it is a script interpreter, and a missing leaprc or an unparameterisable residue leaves it printing a banner, exiting 0, and writing nothing -- always check that the prmtop exists and that its atom count and net charge are what you expected."

IMAGE=ambertools_26.sif
# CPU only, and that is the licence boundary rather than a technical one: the
# GPU engine is pmemd.cuda, which is not in this package. Nothing here has CUDA
# kernels, so there is no ceiling to declare.
GPU=0
APPDIR=/opt/env
# No ENTRY: this image is a toolbox of a dozen separately useful binaries, not
# one program. Naming any of them would make `chpc-tool exec ambertools --help`
# mean something arbitrary. Spell the tool out: `exec ambertools -- tleap ...`.
ENTRY=

tool_exports() {
  echo "SIF_AMBERTOOLS=\"$(_image_path)\""
  echo "AMBERHOME=\"$APPDIR\""
  echo "AMBERTOOLS_PYTHON=\"$APPDIR/bin/python\""
}

tool_doctor() {
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c 'command -v tleap >/dev/null 2>&1' \
      || { echo "no tleap in the image"; return 1; }
    # The force field data, not the binary. tleap runs and exits 0 without it.
    apptainer exec "$(_image_path)" test -s "$APPDIR/dat/leap/cmd/leaprc.protein.ff14SB" \
      || { echo "no leaprc.protein.ff14SB -- tleap will exit 0 and build nothing"; return 1; }
    _n=$(apptainer exec "$(_image_path)" sh -c 'ls /opt/env/dat/leap/cmd | wc -l' 2>/dev/null)
    echo "tleap + ff14SB present (${_n:-?} leaprc files); pmemd.cuda is NOT here, see the amber entry"
  else
    echo "AmberTools is in the image, nothing on the share; image unchecked (no apptainer here)"
  fi
}
