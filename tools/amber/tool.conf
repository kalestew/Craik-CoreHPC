# Amber -- molecular dynamics.
NAME=amber
VERSION=24
KIND=native
STATUS=planned
LICENSE="AmberTools is free; the pmemd engine needs a paid site licence"
UPSTREAM=https://ambermd.org/
NOTE="Late-stage only, for the final one to three designs. Two halves with different licences: AmberTools ships free, pmemd and pmemd.cuda do not. Build pmemd.cuda against the node driver, CUDA 13.2."
PREFIX=$CHPC_SOFTWARE/amber24
tool_exports() {
  echo "AMBERHOME=\"$PREFIX\""
}
tool_doctor() {
  [ -x "$PREFIX/bin/pmemd.cuda" ] || { echo "no pmemd.cuda under $PREFIX (AmberTools alone will not do MD at useful speed)"; return 1; }
  echo "AMBERHOME=$PREFIX"
}
