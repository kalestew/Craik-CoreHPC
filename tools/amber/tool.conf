# Amber -- the LICENSED pmemd engine. AmberTools is a separate entry.
NAME=amber
VERSION=26
KIND=native
# STATUS=planned, and the blocker is a LICENCE, not work. Everything that can
# be done without one has been split out into ../ambertools, which is built and
# needs nothing. What is left here is pmemd and pmemd.cuda, which cannot be
# downloaded, packaged or tested until the site licence exists. See README.md
# for exactly what to do on the day it arrives.
STATUS=planned
LICENSE="pmemd and pmemd.cuda need a PAID Amber site licence from ambermd.org. AmberTools is open source and is ../ambertools, which needs no licence"
UPSTREAM=https://ambermd.org/
UPSTREAM_REF=
NOTE="THE ONLY THING IN THIS ENTRY IS THE LICENSED ENGINE. Amber ships as two halves and they used to share this entry, which meant the free 90 percent waited on the paid 10 percent: tleap, antechamber, parmed and cpptraj were all unavailable because doctor failed on a missing pmemd.cuda. AmberTools now lives in the ambertools entry, is open source, and is built. What remains here is pmemd and pmemd.cuda -- the fast MD engine -- which requires a paid site licence and cannot be fetched, packaged or tested until the lab has one. BEFORE BUYING ONE, CHECK WHETHER IT IS NEEDED: the combination of ambertools for parameterisation and openmm for GPU integration needs no licence anywhere, reads Amber prmtop/inpcrd directly, and runs on all three of our GPU models. pmemd.cuda is worth the licence for long production runs on large systems, where its single-GPU throughput is the reason people buy it; it is not worth it to run a few nanoseconds on the final one to three designs, which is what this programme's NOTE has always said this entry is for. Late-stage only. Build against the node driver, CUDA 13.2."
PREFIX=$CHPC_SOFTWARE/amber26

tool_exports() {
  echo "AMBERHOME=\"$PREFIX\""
  echo "PMEMD_CUDA=\"$PREFIX/bin/pmemd.cuda\""
}

tool_doctor() {
  # Report the licensed engine's absence as the expected state, not as breakage.
  # This entry is blocked on a purchase, and a FAIL row for something nobody has
  # bought yet is the false alarm that teaches people to skim past doctor. The
  # alphafold3 entry reports its missing databases the same way.
  if [ ! -d "$PREFIX" ]; then
    echo "not installed at $PREFIX -- pmemd needs a PAID licence (README.md). AmberTools is the ambertools entry and needs none"
    return 0
  fi
  if [ -x "$PREFIX/bin/pmemd.cuda" ]; then
    echo "pmemd.cuda present at $PREFIX"
    return 0
  fi
  echo "$PREFIX exists but has no pmemd.cuda -- AmberTools alone will not do MD at useful speed; see ../ambertools and ../openmm"
  return 1
}
