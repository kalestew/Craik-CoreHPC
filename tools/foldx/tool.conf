# FoldX 5.1 -- stability ddG. Licensed. See README.md and assets.tsv.
NAME=foldx
VERSION=5.1
KIND=native
STATUS=verified
LICENSE="proprietary; free academic licence from foldxsuite.crg.es"
UPSTREAM=https://foldxsuite.crg.es/
UPSTREAM_REF=foldx_20270131

PREFIX=$CHPC_SOFTWARE/foldx5.1

# FoldX filenames encode their own expiry date (foldx5.1_20261231), so the
# binary is found by glob rather than named here -- your copy expires on a
# different day from anyone else's. A `for` over the glob, not `ls`, because an
# unmatched glob under `set -e` would otherwise kill the caller.
tool_exports() {
  _b=""
  for _c in "$PREFIX"/foldx5.1_* "$PREFIX"/foldx_* "$PREFIX"/foldx; do
    if [ -x "$_c" ]; then _b="$_c"; break; fi
  done
  # Empty is a valid answer: the stability consensus degrades to Rosetta alone.
  echo "FOLDX_BINARY=\"$_b\""
}

tool_doctor() {
  _b=""
  for _c in "$PREFIX"/foldx5.1_* "$PREFIX"/foldx_* "$PREFIX"/foldx; do
    if [ -x "$_c" ]; then _b="$_c"; break; fi
  done
  [ -n "$_b" ] || { echo "no FoldX executable under $PREFIX"; return 1; }
  # Check the BANNER, not the file. An expired FoldX is still present, still
  # executable, and only says so when it runs -- a -x test reports a working
  # FoldX that then fails every call.
  _out=$("$_b" -h 2>&1 | head -40 || true)
  case "$_out" in
    *"time has expired"*)
      echo "LICENCE EXPIRED ($(basename "$_b")) -- re-download from foldxsuite.crg.es"
      return 1 ;;
  esac
  [ -f "$PREFIX/rotabase.txt" ] || echo "WARNING: no rotabase.txt beside the binary"
  echo "$(basename "$_b"), banner clean"
}
