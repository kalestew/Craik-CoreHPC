# PyRosetta -- the Rosetta API from python.
NAME=pyrosetta
VERSION=
KIND=conda
STATUS=planned
LICENSE="free academic, paid commercial via UW CoMotion; same licence as Rosetta"
UPSTREAM=https://www.pyrosetta.org/
NOTE="For protocols that are awkward as RosettaScripts XML. BLOCKED ON CREDENTIALS, NOT ON WORK: PyRosetta is free for academic use but is distributed from a password-protected channel, and the username and password come with the licence from UW CoMotion. A SEPARATE LICENCE FROM THE ROSETTA SOURCE BUILD -- the rosetta entry being verified does NOT cover this one, and that is the mistake this NOTE exists to prevent. Install with: conda create -p PREFIX -c https://USERNAME:PASSWORD@conda.rosettacommons.org pyrosetta, on the login node, then keep the credentials in CHPC_LICENSES/pyrosetta mode 640 and never in a tool.conf, a job script or git. TWO OTHER ENTRIES WAIT ON THIS ONE: bindcraft calls pyrosetta.init() at import scope and cannot run without it at all, and rfdiffusion2 lists pyrosetta in the environment upstream ships -- though its core inference imports it lazily and does not need it, so only silent-file IO and the Rosetta benchmark metrics are lost. VERIFY THE BUILD IS NOT A STUB: pyrosetta.init() succeeding proves the licence and the database loaded, which importing the module does not."
PREFIX=${CONDA_ENVS_PATH:-${CHPC_USER_SCRATCH:-/mnt/scratch/user/$USER}/envs}/pyrosetta
tool_exports() { echo "PYROSETTA_PYTHON=\"$PREFIX/bin/python\""; }
