# IntelliFold -- IntelliGen's AlphaFold3-class predictor, on AF3's own
# JAX/XLA inference engine, with IntelliGen's own weights.
#
# The reason it is worth an entry next to protenix and alphafold3: Apache-2.0
# on BOTH halves, commercial use permitted, and an AlphaFold-3 input dialect --
# so a bonded input written for AF3 is meant to run here unchanged, which is
# the interoperability alphafold3's own weights licence denies us.
NAME=intellifold
VERSION=2
KIND=container
# STATUS=planned: nothing is built and nothing has been run. Do not flip this
# past `built` until test.sh passes on a compute node -- a container that
# starts and cannot find its weights looks identical to a working one until
# real work is submitted.
# built 2026-09-25: the image exists, its %test passes, and it has folded a
# real covalent complex on a compute node -- twice, on two ligand routes.
#
# STATUS=verified 2026-09-27 on ggpu1-06 (NVIDIA L40S), job 2008659, 2 m 32 s.
# Both gates met: it folds, and it puts a declared bond on the declared atom.
#
# The first run of the test FAILED and the tool was not at fault. Case 2 bonded
# a cysteine to the CH3 of ACT (the acetate ion) and read the result with
# `find | head -1`, which is seed-1/sample-0 -- the single worst draw of that
# seed's five, at 2.231 A, with four of the other five inside the gate. A
# property of one arbitrary sample is not a property of the tool.
#
# What 95 folds then established, and it is the thing to know about this entry:
# a declared bond is a PROPOSAL THE SEQUENCE PRIOR CAN VETO. N-A-T (an
# N-glycosylation sequon) gave 15/15 bonded at 1.336-1.478 A; N-A-K, one residue
# different and two positions from the bond, gave 0/25 with the sugar 6.7-10.9 A
# away. Same JSON, same seeds, no warning, no _struct_conn either way, no score
# that moves. Reversing the endpoints changes nothing, so the pair is unordered
# and the sequon is the whole variable. Case 2 is now the sequon case because it
# is the only configuration deterministic enough to gate on, and case 3 carries
# sotorasib at its real rate: on C25 in 25/25 draws, closed in 17/25, built
# systematically ~0.25 A long because the CCD flags no leaving atom on a warhead
# carbon that already carries three hydrogens. See README.md.
STATUS=verified
# Verified against upstream's README 2026-09-24. It vendors AlphaFold 3's
# CODE, which is also Apache-2.0; it does NOT use AF3's weights, which are
# the non-commercial half. That distinction is the entire point of the entry.
LICENSE="Apache-2.0, code and model parameters, academic and commercial use"
UPSTREAM=https://github.com/IntelliGen-AI/IntelliFold
UPSTREAM_REF=               # pin the exact pip version here when the image is built
NOTE="Apache-2.0 on code and weights both, which is what distinguishes it from alphafold3 in this registry. It runs on AF3's own JAX/XLA engine, vendored as third_party/alphafold3 and BUILT FROM SOURCE at install time, so the image needs a full C/C++ toolchain in %post -- see the .def. Input is an AlphaFold-3-style JSON; the bond form is bondedAtomPairs with [entity_id, residue_id, atom_name] and 1-based residues, which is an ENTITY LABEL, not protenix's 1-based index into the sequences list -- the two are not interchangeable and neither errors on the other's convention. SETTLED 2026-09-27, 95 folds on ggpu1-06: bondedAtomPairs IS honoured and the bond is always on the declared atom -- but A DECLARED BOND IS A PROPOSAL THE SEQUENCE PRIOR CAN VETO. The same ASN-NAG bond gave 15/15 at 1.336-1.478 A in an N-A-T sequon and 0/25, free sugar 6.7-10.9 A away, in N-A-K: one residue, two positions from the bond, no warning, no _struct_conn either way, no confidence score that moves. So 'the tool honours this vocabulary' does NOT license 'this bond will be built' for a chemistry the model has not seen in that context -- measure the system you are folding. The cysteine-warhead case is on the right carbon in 25/25 and closed in 17/25, built ~0.25 A long because the CCD flags no leaving atom on a warhead carbon already carrying three hydrogens, and this dialect has no way to say 'remove that hydrogen'. Upstream's README still mentions bondedAtomPairs nowhere; the capability is real and undocumented. Narrowed 2026-09-25 by reading the source: run_jax_inference.py parses input with alphafold3.common.folding_input.load_fold_inputs_from_path, AF3's own parser, and neither bondedAtomPairs nor userCCD appears anywhere in the intellifold package -- so both keys are READ by the same code that reads them for AF3. Parsing is not featurising; only test.sh case 2, on the coordinates, settles whether the bond reaches the model. If AF3's rule carries over, a SMILES ligand CANNOT carry a bond at all and you need a registered CCD code or a userCCD block. There is NO torch in this image, so the usual torch._C._cuda_getArchFlags() route to GPU_MAX_CC does not exist here -- see README.md. MSAs: compute nodes have no internet, so run with --norun_data_pipeline and supply unpairedMsa/pairedMsa in the JSON. NO TRAINING CUTOFF IS STATED UPSTREAM for these v2 weights -- re-checked 2026-09-25 against the IntelliFold-2 preprint (bioRxiv 2026.02.09.704787), the GitHub README, the Hugging Face card and the staged model_v2 directory, and none of the four gives a date; the paper says only that it re-processed the PDB with an updated pipeline. A cutoff is a property of the WEIGHTS, so IntelliFold-1's number does not carry over, and the risk runs the dangerous way: a 2026 model re-processing the PDB plausibly includes a 2024 release, which turns a template set meant as independent evidence into a memory aid. Templating works mechanically; the admissibility argument is the consumer's to establish. See README.md."

IMAGE=intellifold_2.sif
GPU=1
APPDIR=/opt/intellifold
ENTRY=intellifold           # `intellifold predict in.json --model-dir=... --output-dir=...`

# GPU_MAX_CC -- 9.0 as of 2026-09-25. The history below is kept because it is
# why this number means something different here than elsewhere.
#
# It WAS UNMEASURED, and harder to measure here than anywhere else in this
# registry, because this image has no torch.
#
# The literal value below FAILS CLOSED: chpc-tool compares with awk (a+0 > b+0)
# and awk reads a non-numeric string as 0, so every device is above this
# ceiling and `chpc-tool exec intellifold` refuses on any GPU node until a real
# number replaces it. That is the right state while the answer is unknown --
# the gpu partition is L40S 8.9, H100 NVL 9.0 and RTX PRO 6000 Blackwell 12.0,
# a bare --gres=gpu:1 lands on any of them, and five tools here already declare
# 9.0 and die on the Blackwell nodes with what reads as a broken install
# (doc 05).
#
# DO NOT read this number off torch in this image. There is no torch; and if a
# future rebuild adds it for checkpoint conversion, its arch flags describe the
# torch wheel and say NOTHING about the JAX/XLA path that actually runs the
# model. The honest qualification is in README.md: run one small fold on each
# of the three device classes and record the job ids, the way boltz's entry did
# for Blackwell.
# 9.0, and the provenance is different from every other entry here. There is no
# torch in this image, so torch._C._cuda_getArchFlags() -- the route the rest of
# the registry uses -- does not exist. What this number rests on instead is a
# REAL FOLD: a 658-token covalent peptide-MHC/Fv complex, five diffusion
# samples, completed on an H100 NVL (cc 9.0) on 2026-09-25, twice.
#
# So read it as a LOWER BOUND that has been exercised rather than a ceiling that
# has been derived. 8.9 (L40S) and 9.0 (H100 NVL) are permitted and 12.0 (RTX
# PRO 6000) is refused, which is the right behaviour while Blackwell is
# untested: jax compiles its Pallas/Triton kernels at first use and a node class
# nothing has run on is a node class nothing has run on.
GPU_MAX_CC=9.0
# WHERE THIS HAS ACTUALLY RUN. GPU_MAX_CC above is a ceiling and admits
# nvidia_h100_nvl at cc 9.0 as well; this records what has been exercised, and
# both classes now have been. L40S: 300 production folds on 2026-09-26, all exit
# 0, plus `chpc-tool test intellifold` on ggpu1-06 (job 2008659, 2026-09-27) and
# the 95-fold covalent measurement on the same node. H100 NVL: the 658-token
# covalent folds of 2026-09-25, whose job ids were not recorded -- weaker
# provenance than the L40S rows, but a real fold on a real node, and it is what
# GPU_MAX_CC=9.0 rests on. Blackwell (12.0) stays refused and untried.
GPU_TESTED=nvidia_l40s,nvidia_h100_nvl

# IntelliFold downloads its weights from Hugging Face into ./model_v2 on first
# run -- a RELATIVE path, so a job that cd's anywhere gets a different, empty
# directory and then tries to download from a compute node with no internet.
# --model-dir takes an absolute one; this is it, and it is on FAC rather than
# scratch because scratch is purged at 30 days (doc 02).
tool_exports() {
  echo "SIF_INTELLIFOLD=\"$(_image_path)\""
  echo "INTELLIFOLD_MODEL_DIR=\"$(_refdata intellifold)/model_v2\""
}

tool_doctor() {
  _m="$(_refdata intellifold)/model_v2"
  [ -d "$_m" ] || { echo "no model dir at $_m -- on the LOGIN node: tools/intellifold/fetch-weights.sh"; return 1; }

  # Both artefacts, not a file count. Upstream ships two and they are not
  # interchangeable: intellifold_v2.bin.zst is the checkpoint and
  # intellifold_v2_fourier.npz is the Fourier embedding table. Half a download
  # is a directory that looks populated and a run that fails at load.
  _ck=$(find "$_m" -maxdepth 2 -type f \( -name '*.bin.zst' -o -name '*.bin' \) 2>/dev/null | head -1)
  [ -n "$_ck" ] || { echo "no checkpoint (*.bin.zst) under $_m -- re-run tools/intellifold/fetch-weights.sh"; return 1; }
  [ -s "$_ck" ] || { echo "checkpoint $_ck is empty"; return 1; }
  _fo=$(find "$_m" -maxdepth 2 -type f -name '*.npz' 2>/dev/null | head -1)
  [ -n "$_fo" ] || { echo "checkpoint present but no *.npz under $_m -- half a download looks like a full one until the model loads"; return 1; }

  # Probe the image rather than assume. AF3's engine is built from source in
  # %post and the toolchain is kept; if a rebuild drops it, say so here rather
  # than let a job find out.
  _cc="toolchain ok"
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c \
      'command -v cc >/dev/null 2>&1 || command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1' \
      >/dev/null 2>&1 \
      || _cc="NO C COMPILER in the image -- the vendored AF3 build is gone or the base was slimmed"
  else
    _cc="toolchain unchecked (no apptainer here)"
  fi

  _g="GPU_MAX_CC $GPU_MAX_CC"
  case "$GPU_MAX_CC" in
    UNMEASURED) _g="GPU_MAX_CC UNMEASURED -- chpc-tool exec will refuse on every GPU node until it is measured, and there is no torch here to measure it with; see README.md" ;;
  esac
  echo "model dir $_m ($(basename "$_ck"), $(basename "$_fo")); $_cc; $_g"
}
