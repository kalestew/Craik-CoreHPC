# BindCraft -- binder design pipeline.
NAME=bindcraft
VERSION=1
KIND=container
# STATUS=planned, and the blocker is PYROSETTA, which is licence-gated. This is
# not a packaging problem that more effort solves: bindcraft.py calls
# pyrosetta.init() at MODULE SCOPE, so the import fails before any argument is
# parsed, and there is no flag to skip it. See README.md for the two ways
# forward, one of which needs no licence.
STATUS=planned
LICENSE="MIT for BindCraft itself. BUT it hard-depends on PyRosetta, which is free academic and PAID commercial via UW CoMotion -- upstream's own installer says so. The effective licence of a working install is PyRosetta's."
UPSTREAM=https://github.com/martinpacesa/BindCraft
UPSTREAM_REF=
NOTE="Alternative to RFdiffusion for the Fc exosite binders. Heavy: it runs its own design-predict-filter loop and wants a long GPU allocation -- upstream quotes 5 minutes for a 250-residue trajectory on an H100 and 2 to 3 hours for 900 residues, with easy targets needing about 100 trajectories and hard ones 1000 to 10000. BLOCKED ON PYROSETTA, NOT ON WORK: pyrosetta.init() runs at import time in bindcraft.py and PyRosetta is used for FastRelax, interface scoring and RMSD, with no flag to disable it. Two routes forward. (1) Obtain a PyRosetta licence -- free for academic use, and the lab already has Rosetta -- then build; note the pyrosetta entry is a SEPARATE licence from the rosetta source build. (2) Use the FreeBindCraft fork, which adds --no-pyrosetta and substitutes OpenMM plus PDBFixer and FASPR for relax, sc-rs for shape complementarity and FreeSASA for SASA; it is faster, and its own README says Rosetta-specific metrics without open-source equivalents are NOT computed and placeholder values are used where the default filters need them, so the filters must be revisited rather than inherited. WEIGHTS ARE A SECOND TRAP: it wants the full AlphaFold2 parameter tar, all ten of params_model_1-5_ptm and _multimer_v3, and our colabfold share holds the COLAB tar, which contains only params_model_2_ptm. Do not assume the existing AF2 params are reusable without checking the ten filenames. THIRD: its jax pin of 0.6.0 or below has no confirmed sm_120 support, so a Blackwell node may not work at all -- test jax.devices() there before committing to the recipe."

IMAGE=bindcraft_1.sif
GPU=1
# UNMEASURED until the image exists. The jax pin is the question: jaxlib <= 0.6.0
# has no confirmed Blackwell (sm_120) support, so this may have to be capped at
# 9.0 and restricted to the L40S and H100 NVL nodes.
GPU_MAX_CC=
APPDIR=/opt/BindCraft
ENTRY=python
tool_exports() {
  echo "SIF_BINDCRAFT=\"$(_image_path)\""
  echo "BINDCRAFT_DIR=\"$APPDIR\""
  # BindCraft resolves AlphaFold2 parameters under <dir>/params/, so this names
  # the PARENT. Whether the colabfold share's copy is complete enough is the
  # open question in README.md.
  echo "BINDCRAFT_AF_PARAMS_DIR=\"$(_refdata bindcraft)\""
}

tool_doctor() {
  _d="$(_refdata bindcraft)"
  [ -d "$_d/params" ] || { echo "no AlphaFold2 parameters at $_d/params -- BindCraft needs all ten of params_model_{1..5}_ptm and _multimer_v3 (README.md)"; return 1; }
  # Count the ten files it actually requires rather than trusting the directory.
  # The colabfold tar contains only params_model_2_ptm, and a partial set fails
  # at run time after the GPU allocation has already been granted.
  _missing=""
  for _i in 1 2 3 4 5; do
    for _s in ptm multimer_v3; do
      [ -s "$_d/params/params_model_${_i}_${_s}.npz" ] || _missing="$_missing params_model_${_i}_${_s}.npz"
    done
  done
  [ -z "$_missing" ] || { echo "incomplete AF2 parameter set at $_d/params, missing:$_missing"; return 1; }
  echo "all ten AF2 parameter files present at $_d/params"
}
