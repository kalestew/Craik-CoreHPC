# PLACER -- stochastic active-site repacking, for preorganisation. See README.md.
NAME=placer
VERSION=1.0
KIND=container
# Verified 2026-09-19 on an L40S (cc 8.9). Built in 1412 s, 4.17 GB. test.sh:
#   ok: 3 models in 4dtz_selftest_model.pdb, coordinates differ between
#   samples, 3 score rows
# The "coordinates differ" half is the one that matters -- an ensemble of
# identical models would satisfy a count and reproduce the exact degeneracy
# PLACER exists to remove. See README.md.
STATUS=verified
LICENSE=BSD-3-Clause        # covers code and weights
UPSTREAM=https://github.com/baker-laboratory/PLACER
UPSTREAM_REF=7dc5563300e7143582d85636bdd413d4c7688e9a

IMAGE=placer_1.0.sif
GPU=1
# Highest compute capability this image has kernels for, measured with
# torch._C._cuda_getArchFlags(). chpc-tool refuses a newer device up front.
GPU_MAX_CC=9.0
ENTRY=python

# PLACER is the one tool whose host-side checkout cannot be absorbed into the
# image: the job invokes run_PLACER.py BY PATH and cd's into the checkout, so
# PLACER_DIR is needed whatever the runtime. Checkout and weights/ together on
# FAC, treated as reference data.
tool_exports() {
  echo "PLACER_DIR=\"$(_refdata placer)\""
  echo "SIF_PLACER=\"$(_image_path)\""
}

tool_doctor() {
  _d="$(_refdata placer)"
  [ -f "$_d/run_PLACER.py" ] || { echo "no run_PLACER.py under $_d"; return 1; }
  [ -d "$_d/weights" ] || { echo "no weights/ under $_d"; return 1; }
  echo "checkout and weights at $_d"
}
