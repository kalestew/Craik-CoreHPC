# PLACER -- stochastic active-site repacking, for preorganisation. See README.md.
NAME=placer
VERSION=1.0
KIND=container
STATUS=planned
LICENSE=BSD-3-Clause        # covers code and weights
UPSTREAM=https://github.com/baker-laboratory/PLACER   # confirm before building
UPSTREAM_REF=

IMAGE=placer_1.0.sif
GPU=1
ENTRY=python

# PLACER is the one tool whose host-side checkout cannot be absorbed into the
# image: the job invokes run_PLACER.py BY PATH and cd's into the checkout, so
# PLACER_DIR is needed whatever the runtime. Checkout and weights/ together on
# FAC, treated as reference data.
tool_exports() {
  echo "PLACER_DIR=\"$(_refdata placer)\""
  echo "SIF_PLACER=\"$(_image_path)\""
}

tool_doctor() {
  _d="$(_refdata placer)"
  [ -f "$_d/run_PLACER.py" ] || { echo "no run_PLACER.py under $_d"; return 1; }
  [ -d "$_d/weights" ] || { echo "no weights/ under $_d"; return 1; }
  echo "checkout and weights at $_d"
}
