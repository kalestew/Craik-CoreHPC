# ANARCI -- antibody domain numbering.
NAME=anarci
VERSION=
KIND=conda
STATUS=planned
LICENSE=BSD-3-Clause
UPSTREAM=https://github.com/oxpig/ANARCI
NOTE="Numbers antibody variable domains in IMGT, Kabat, Chothia and Martin. Directly relevant here: this project juggles EU numbering for IgG against three protease conventions, and ANARCI is the tool that does the antibody half without hand-maintained maps."
PREFIX=${CONDA_ENVS_PATH:-${CHPC_USER_SCRATCH:-/mnt/scratch/user/$USER}/envs}/anarci
tool_exports() { echo "ANARCI_PYTHON=\"$PREFIX/bin/python\""; }
