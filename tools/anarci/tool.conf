# ANARCI -- antibody domain numbering.
NAME=anarci
VERSION=2024.05.21
# KIND=container, though the package comes from bioconda. The entry was
# declared KIND=conda because that is where ANARCI lives; it is not where the
# LAB should keep it. A conda env under $CHPC_USER_SCRATCH/envs is per-user and
# sits on scratch, which is purged at 30 days and wiped at quarterly
# maintenance, so every person would recreate this one forever. The image is
# built once, immutable, shared, and survives the purge. (python-bio stays
# KIND=conda because its pins really do belong to each project.)
KIND=container
# STATUS=verified 2026-09-26: built, published, and test.sh's six cases passed
# on ccpu1-01 -- through the scratch build and again through the share's copy.
STATUS=verified
LICENSE=BSD-3-Clause
UPSTREAM=https://github.com/oxpig/ANARCI
UPSTREAM_REF="bioconda anarci 2024.05.21 (noarch, pyhdfd78af_0), hmmer 3.4"
NOTE="Numbers antibody variable domains in IMGT, Kabat, Chothia and Martin. Directly relevant here: this project juggles EU numbering for IgG against three protease conventions, and ANARCI is the tool that does the antibody half without hand-maintained maps. IT SHELLS OUT TO THE hmmscan BINARY and numbers against a 128-column IMGT profile set that must be PRESSED (ALL.hmm plus .h3f/.h3i/.h3m/.h3p); both are baked into the image, and neither is exercised by importing the module, so an import test says nothing. Never rebuild the profiles: they need hmmbuild --hand, and without it hmmbuild drops mostly-gap columns and the result is narrower than 128, which ANARCI cannot use. A pip install is NOT equivalent -- the PyPI package is a third-party repackaging that declares no HMMER dependency, so it imports and then dies with FileNotFoundError: 'hmmscan'."

IMAGE=anarci_2024.05.21.sif
# Pure python plus HMMER. Nothing to accelerate, and no CUDA anywhere in the
# image, so GPU=0 and there is no ceiling to declare.
GPU=0
APPDIR=/opt/env
ENTRY=ANARCI

tool_exports() {
  echo "SIF_ANARCI=\"$(_image_path)\""
  echo "ANARCI_PYTHON=\"$APPDIR/bin/python\""
}

tool_doctor() {
  # Nothing on the share: the profile set and HMMER are in the image. What can
  # go wrong is an image whose profiles were not pressed, which no path test
  # catches and every numbering call fails on.
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" sh -c 'command -v hmmscan >/dev/null 2>&1' \
      || { echo "no hmmscan in the image -- every numbering call would fail"; return 1; }
    _h=$(apptainer exec "$(_image_path)" python -c \
        'import anarci, os; print(os.path.join(os.path.dirname(anarci.__file__), "dat", "HMMs"))' 2>/dev/null)
    [ -n "$_h" ] || { echo "cannot locate the HMM directory inside the image"; return 1; }
    apptainer exec "$(_image_path)" test -s "$_h/ALL.hmm.h3p" \
      || { echo "IMGT profiles are not pressed ($_h) -- numbering will fail at run time"; return 1; }
    echo "hmmscan present, IMGT profiles pressed, in-image at $_h"
  else
    echo "profiles and HMMER are in the image, nothing on the share; image unchecked (no apptainer here)"
  fi
}
