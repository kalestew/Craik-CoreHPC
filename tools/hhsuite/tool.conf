# HH-suite -- profile HMM search.
NAME=hhsuite
VERSION=3.3.0
KIND=container
STATUS=verified
LICENSE=GPL-3.0
UPSTREAM=https://github.com/soedinglab/hh-suite
UPSTREAM_REF="v3.3.0 hhsuite-3.3.0-AVX2-Linux.tar.gz"
NOTE="hhalign needs nothing. hhblits and hhsearch need a database (UniRef30 is ~90 GB uncompressed, PDB70 ~60 GB) which is NOT in the image and not on the share yet -- budget the space and the download before relying on them."
IMAGE=hhsuite_3.sif
GPU=0
# hhsearch is the usual entry point, but the image carries the whole suite:
# hhblits, hhalign, hhmake, hhfilter, hhconsensus, reformat.pl, addss.pl.
# Reach the others by spelling out the path, e.g.
#   chpc-tool exec hhsuite -- /opt/hhsuite/bin/hhalign -i q.a3m -t t.a3m
ENTRY=hhsearch
# Only the image path. HHLIB and the PATH additions that the perl scripts
# (addss.pl, reformat.pl) need are set in the .def's %environment, which is
# the right place: tool_exports emits `export`, so anything named here lands
# in the HOST job environment on its way into the container, and a name as
# generic as HHLIB should not.
tool_exports() { echo "SIF_HHSUITE=\"$(_image_path)\""; }
