# MMseqs2 -- sequence search and clustering.
NAME=mmseqs2
VERSION=18-8cc5c
KIND=container
STATUS=verified
LICENSE=GPL-3.0
UPSTREAM=https://github.com/soedinglab/MMseqs2
NOTE="MSA generation and large-scale clustering. Also what ColabFold uses underneath."
IMAGE=mmseqs2_18.sif
GPU=0
ENTRY=mmseqs
tool_exports() {
  echo "SIF_MMSEQS2=\"$(_image_path)\""
  # Databases live under data/mmseqs2, one directory per database, the
  # prefix inside named like the directory; fetch-db.sh writes that layout.
  # The colabfold_* tree beside them is colabfold_search's, built with the
  # mmseqs inside the colabfold image, and is not a target for this one.
  echo "MMSEQS2_DB_DIR=\"$(_refdata mmseqs2)\""
  echo "MMSEQS2_DB_SWISSPROT=\"$(_refdata mmseqs2)/swiss-prot/swiss-prot\""
}

tool_doctor() {
  _p="$(_refdata mmseqs2)/swiss-prot/swiss-prot"
  if [ -f "$_p" ]; then
    echo "Swiss-Prot database $_p"
  else
    # A warning, not a failure: easy-search takes a FASTA as its target, so
    # the tool works without a database; a search against
    # $MMSEQS2_DB_SWISSPROT does not.
    echo "WARNING: no Swiss-Prot database at $_p -- on the login node: tools/mmseqs2/fetch-db.sh"
  fi
}
