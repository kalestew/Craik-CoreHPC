# RFdiffusion -- generative backbone design. See README.md.
NAME=rfdiffusion
VERSION=1.1
KIND=container
STATUS=planned
LICENSE=                    # confirm from upstream before any commercial use
UPSTREAM=https://github.com/RosettaCommons/RFdiffusion
UPSTREAM_REF=

IMAGE=rfdiffusion_1.1.sif
GPU=1
APPDIR=/opt/RFdiffusion
ENTRY=python

# Weights and the IGSO3 schedule cache live on FAC, NOT inside the image:
# weights are immutable and shared, images should stay rebuildable, and a
# weights refresh should not force an image rebuild.
tool_exports() {
  echo "SIF_RFDIFFUSION=\"$(_image_path)\""
  echo "RFDIFFUSION_DIR=\"$APPDIR\""
  echo "RFDIFFUSION_MODELS=\"$(_refdata rfdiffusion)/models\""
  echo "RFDIFFUSION_SCHEDULES=\"$(_refdata rfdiffusion)/schedules\""
}

tool_doctor() {
  _m="$(_refdata rfdiffusion)/models"
  [ -d "$_m" ] || { echo "no weights at $_m -- chpc-assets install rfdiffusion"; return 1; }
  # The schedule directory is a CACHE and RFdiffusion writes to it on first
  # use. Read-only here means every job pays to recompute, or dies.
  _s="$(_refdata rfdiffusion)/schedules"
  [ -d "$_s" ] && [ -w "$_s" ] || echo "WARNING: $_s missing or not writable; first run will be slow"
  echo "weights $_m"
}
