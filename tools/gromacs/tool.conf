# GROMACS -- molecular dynamics.
NAME=gromacs
VERSION=2026.3
KIND=container
STATUS=planned
LICENSE=LGPL-2.1
UPSTREAM=https://www.gromacs.org/
UPSTREAM_REF="gromacs-2026.3.tar.gz, md5 7987af0c6ab939ab6e639f32d0dd260f, built on nvidia/cuda:13.2.1-devel-ubuntu24.04"
NOTE="Third MD option, and the only one of the three with no licence to chase and no conda solve to get wrong. THE MODULE CHECK THIS NOTE USED TO ASK FOR IS DONE (2026-09-26) AND THE ANSWER IS NO: module spider finds no gromacs, and neither does loading CBI, RAD, Sali or nvidia-hpc and searching each -- there is no gromacs, amber or openmm module anywhere on this cluster, so the image is owed and KIND stays container. BUILT FROM SOURCE because both official containers are far too old to run here: NVIDIA's NGC image stops at 2023.2 and lists no Ada and no Blackwell support, and Docker Hub's stops at 2022.2 on CUDA 11.6, which cannot target sm_120 at all. ALWAYS PASS -nb gpu IN A JOB SCRIPT. Without it mdrun decides for itself and falls back to the CPU silently, giving a correct simulation at a fraction of the speed with nothing in the output saying so; with it, mdrun ABORTS when it cannot offload, which is what you want. Confirm in md.log: '1 GPU selected for this run.' GMX_SIMD IS PINNED TO AVX2_256 rather than auto-detected, because cmake detects the SIMD of whichever node configured the build and that is always the login node -- on a cluster whose login and compute CPUs differ, auto-detection yields a binary that is slower or outright illegal on the compute nodes, and the symptom is SIGILL in a job. Whether AVX_512 is faster on our Genoa nodes is worth benchmarking rather than assuming."

IMAGE=gromacs_2026.3.sif
GPU=1
# Compiled for sm_89, sm_90 and sm_120, so every GPU model in the partition is
# covered and there is no ceiling to declare. %post asserts CUDA support is
# actually in the binary, because a CPU-only GROMACS runs everything correctly
# and slowly.
GPU_MAX_CC=
APPDIR=/opt/gromacs
ENTRY=gmx

tool_exports() {
  echo "SIF_GROMACS=\"$(_image_path)\""
  echo "GMXPREFIX=\"$APPDIR\""
  echo "GMXDATA=\"$APPDIR/share/gromacs\""
  echo "GMXBIN=\"$APPDIR/bin\""
}

tool_doctor() {
  if command -v apptainer >/dev/null 2>&1; then
    # The binary is not the question; how it was compiled is. A GROMACS built
    # without CUDA passes every path test and every --version check, and runs
    # production on the CPU.
    apptainer exec "$(_image_path)" sh -c 'gmx --version 2>/dev/null | grep -q "GPU support:.*CUDA"' \
      || { echo "the image's gmx reports no CUDA support -- it would run production on the CPU"; return 1; }
    # And the topology data, which grompp and solvate need and a botched
    # `make install` can leave behind.
    apptainer exec "$(_image_path)" test -s "$APPDIR/share/gromacs/top/spc216.gro" \
      || { echo "no share/gromacs/top/spc216.gro -- the force field data did not install"; return 1; }
    _v=$(apptainer exec "$(_image_path)" sh -c 'gmx --version 2>/dev/null | grep -i "^GROMACS version" | head -1' 2>/dev/null)
    _s=$(apptainer exec "$(_image_path)" sh -c 'gmx --version 2>/dev/null | grep -i "SIMD instructions" | head -1' 2>/dev/null)
    echo "${_v:-gromacs} with CUDA; ${_s:-SIMD unknown}; remember -nb gpu"
  else
    echo "gromacs is in the image, nothing on the share; image unchecked (no apptainer here)"
  fi
}
