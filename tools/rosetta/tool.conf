# Rosetta 3.14 -- native build. See README.md for why it is not containerised.
NAME=rosetta
VERSION=3.14
KIND=native
# Verified on CoreHPC 2026-09-19 from v2026.38-dev62288. Built with scons exit
# 0 in 11m24s on 32 cores, 0 errors / 91 warnings. 39 shared libraries are
# installed beside the binaries, because the RPATH scons bakes points into the
# scratch build tree -- see README.md. test.sh:
#   rosetta_scripts total_score=2.723, cartesian_ddg wrote 2 rows to mut.ddg
STATUS=verified
LICENSE="free academic, paid commercial via UW CoMotion"
UPSTREAM=https://github.com/RosettaCommons/rosetta
UPSTREAM_REF=v2026.38-dev62288

# build-linux.sh installs bin/ and database/ directly under PREFIX, so a
# consumer never has to know that the source tree puts them in source/bin.
PREFIX=$CHPC_SOFTWARE/rosetta314
# The binary's full name carries the extras field: <app>.default.linuxgccrelease.
# The Mac side sets the same shape (default.macosclangrelease), so keep them
# parallel. build-linux.sh also drops a bare <app>.linuxgccrelease symlink,
# because 00_env_check.sh falls back to that spelling when nothing exports
# ROSETTA_SUFFIX.
SUFFIX=default.linuxgccrelease

tool_exports() {
  echo "ROSETTA_BIN=\"$PREFIX/bin\""
  echo "ROSETTA_DB=\"$PREFIX/database\""
  echo "ROSETTA_SUFFIX=\"$SUFFIX\""
}

tool_doctor() {
  # The two apps the pipelines actually invoke. `relax` is deliberately not
  # built: relaxation goes through rosetta_scripts with a protocol XML.
  for _a in rosetta_scripts cartesian_ddg; do
    [ -x "$PREFIX/bin/$_a.$SUFFIX" ] || { echo "missing $PREFIX/bin/$_a.$SUFFIX"; return 1; }
  done
  [ -d "$PREFIX/database" ] || { echo "no database at $PREFIX/database"; return 1; }
  # The Sali module collection ships 3.10. If someone loaded that to save the
  # build, every ddG number changes and Gate 6 has to be re-run.
  echo "rosetta_scripts + cartesian_ddg, $SUFFIX"
}
