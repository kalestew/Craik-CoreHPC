# AlphaFold 3 -- structure prediction. See README.md before building.
#
# Named `alphafold3` rather than `af3` to match upstream; the weights file
# upstream ships is `af3.bin.zst`.
NAME=alphafold3
VERSION=3
KIND=container
# STATUS=planned: the WEIGHTS are staged and verified, the image is not built.
# The blocker is not the image, it is the genetic databases -- see README.md.
# Do not flip this to built/verified until `chpc-tool exec alphafold3` runs an
# actual inference, because a container that starts and cannot find a database
# looks identical to a working one until someone submits real work.
STATUS=planned
LICENSE="weights: CC-BY-NC-SA 4.0 style Model Parameters Terms of Use, non-commercial, obtained by request from Google DeepMind; code: Apache-2.0"
UPSTREAM=https://github.com/google-deepmind/alphafold3
UPSTREAM_REF=
NOTE="AF3 forbids covalent bonds BETWEEN OR WITHIN POLYMER ENTITIES -- upstream docs/input.md: 'Defining covalent bonds between or within polymer entities is not currently supported' -- so it cannot build tetrahedral-intermediate or acyl-enzyme states, and PLACER is the tool for that. Ligand-to-polymer bonds ARE supported via bondedAtomPairs, which is the haptenated-residue case, so do not read the line above as ruling that out. A ligand written as a smiles field cannot carry a bond ('there is no atom name that could be used to define the bond'); bring it as a registered CCD code or as a userCCD block, whose atom names you assign yourself. Co-folding models barely respond to point mutations (Masters 2025), so do not use it as a variant-ranking oracle. The weights bar commercial use of the OUTPUTS, which matters for a therapeutic programme long after the run is finished. Needs hundreds of GB of genetic databases that are NOT these weights."

IMAGE=alphafold3_3.sif
GPU=1
APPDIR=/opt/alphafold3

# Two separate payloads, and conflating them is the easy mistake: the model
# parameters are ~1 GB and live here; the genetic databases are hundreds of GB
# and are fetched separately (see README.md). A run needs both.
tool_exports() {
  echo "SIF_ALPHAFOLD3=\"$(_image_path)\""
  echo "AF3_WEIGHTS=\"$(_refdata alphafold3)\""
  echo "AF3_DATABASES=\"$(_refdata alphafold3)/databases\""
}

tool_doctor() {
  _w="$(_refdata alphafold3)"
  [ -d "$_w" ] || { echo "no weights at $_w -- chpc-assets install alphafold3"; return 1; }
  _f=""
  for _c in "$_w"/af3.bin.zst "$_w"/af3.bin; do
    if [ -f "$_c" ]; then _f="$_c"; break; fi
  done
  [ -n "$_f" ] || { echo "no af3.bin(.zst) under $_w"; return 1; }
  # Report the databases separately: weights present and databases absent is
  # the state this entry is expected to sit in for a while, and it is not a
  # failure of the weights.
  _d="$_w/databases"
  if [ -d "$_d" ]; then
    echo "weights $(basename "$_f"); databases $_d"
  else
    echo "weights $(basename "$_f"); NO databases at $_d -- inference will not run yet"
  fi
}
