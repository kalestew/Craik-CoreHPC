# Template tool declaration. Copy the two template files, not the directory:
#
#   mkdir ../mytool && cp tool.conf README.md ../mytool/ && $EDITOR ../mytool/tool.conf
#
# Not `cp -r`: make_test_pdb.sh and check_covalent_bond.sh here are shared test
# helpers that entries call in place as $TOOLDIR/../_template/<name>.
#
# Plain shell, sourced by chpc-tool. Keep it bash-3.2 compatible: no
# associative arrays, no ${var^^}, no mapfile. ../README.md has the reference
# for every key ("Reference: tool.conf") and says what belongs here rather
# than in a project.

NAME=                       # defaults to the directory name; set it if they differ
VERSION=
KIND=container              # container | native | conda | venv | module
STATUS=planned              # planned | built | verified   (../README.md, "Add a tool")
                            # plus `external` for a tool deliberately NOT installed
                            # here -- a web service, say. That one is a terminus, not
                            # a rung on the way up: see funclib and pross.
LICENSE=
UPSTREAM=
UPSTREAM_REF=               # exact commit/tag/digest the install was built from; set when built
NOTE=""                     # runtime caveats a user must read before the first run.
                            # ONE double-quoted string: this file is sourced, so an
                            # unquoted backtick or $ runs. `chpc-tool show` prints it.

# --- KIND=container ---------------------------------------------------------
IMAGE=                      # bare name: the scratch mirror if it holds it, else
                            # $CHPC_LAB/containers. An absolute path is used as given.
GPU=0                       # 1 passes --nv. Leave 0 unless the tool needs a GPU.
GPU_MAX_CC=                 # highest compute capability the image has kernels for
                            # (torch._C._cuda_getArchFlags()). 9.0 = not on Blackwell.
                            # exec refuses a newer device up front. Empty = no limit.
GPU_TESTED=                 # comma-separated device classes this entry has been RUN on
                            # and passed, e.g. nvidia_l40s,nvidia_h100_nvl. A different
                            # claim from GPU_MAX_CC: that one is "will not crash above
                            # cc X", this one is "somebody ran it here". A request can
                            # satisfy the ceiling and still be the first run on a class
                            # -- boltz earned STATUS=verified on an RTX PRO 6000 and
                            # then did 1,110 folds without touching one. Empty = nothing
                            # recorded, which h8 doctor reports rather than refuses.
WRITABLE_TMPFS=0            # 1 passes --writable-tmpfs, for config a tool insists on
                            # writing inside its own image. Never for data or weights.
APPDIR=                     # where the code lives inside the image
ENTRY=                      # default program: prepended by `chpc-tool exec` when given no
                            # command, or a first argument that starts with `-`. NOT before
                            # a subcommand or a script path -- the docs always spell the
                            # program out after `--`.

# --- KIND=native / conda / venv ---------------------------------------------
PREFIX=                     # e.g. $CHPC_SOFTWARE/mytool-1.0; exec puts $PREFIX/bin on PATH
ENV_YML=                    # conda: path to the recipe, usually project-supplied
ENV_NAME=                   # conda: environment name (python-bio uses ${CHPC_PYENV:-bio})
SUFFIX=                     # native: binary-name suffix (rosetta: default.linuxgccrelease)

# --- KIND=module ------------------------------------------------------------
MODULE=                     # Lmod modules, loaded one at a time in order: "Sali dssp/2.2.1"

# Variables a project's site.conf wants. Optional. Emit plain assignments, one
# per line, and quote the values. `chpc-tool exec` also exports them inside the
# container. Helpers: _image_path, _prefix, _refdata <tool>, $TOOLDIR, die.
tool_exports() {
  :
}

# A check beyond "the file exists". Optional. Print one line, return 0 or 1.
# This is where a tool that can fail while still being present gets caught --
# an expired licence, a weights directory that was purged from scratch.
tool_doctor() {
  :
}

# Runs BEFORE doctor looks at any path. Optional. Return 0 to carry on, 2 to
# report "not checked" with a message naming what the caller must supply
# (python-bio needs CHPC_PYENV), 1 for broken.
tool_precheck() {
  :
}
