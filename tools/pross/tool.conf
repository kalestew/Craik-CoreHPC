# PROSS -- automated stabilising design.
NAME=pross
VERSION=
KIND=native
# STATUS=external, not planned. A Weizmann WEB SERVER; the local form is a
# Rosetta protocol against the rosetta entry, unwritten here. Carried as
# `planned` it implied an image was owed. See README.md.
STATUS=external
LICENSE="free academic web service; local use needs a Rosetta licence"
UPSTREAM=https://pross.weizmann.ac.il/
UPSTREAM_REF="web service; no local install, no version pinned here"
NOTE="Used as the Weizmann web server, deliberately not installed. Stabilising the parent pays for expression and for serpin resistance, which is why it is in the catalogue at all. Submit a structure and a sequence alignment depth; PROSS returns a handful of stabilised designs, typically with 10-30 mutations each, and the usual practice is to order the two or three most conservative. A local install is a Rosetta protocol needing the rosetta entry and a licence, and nobody here has written it -- so external is the end state. DO NOT COMBINE ITS MUTATIONS WITH ACTIVE-SITE REDESIGN BLINDLY: PROSS optimises the scaffold under the assumption that the functional site is fixed, so a position it stabilises may be one funclib wants to vary. Reconcile the two sets by hand before ordering."

tool_exports() {
  :
}

tool_doctor() {
  echo "web service at $UPSTREAM -- nothing installed on CoreHPC by design"
}
