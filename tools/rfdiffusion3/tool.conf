# RFdiffusion3 -- generative backbone design, the current Baker-lab model.
#
# There is no RFdiffusion3 repository. The model ships as the `rfd3` component
# of RosettaCommons/foundry (pip `rc-foundry`), which also carries RF3 and an
# MPNN entry point. Both github.com/RosettaCommons/RFdiffusion3 and
# github.com/baker-laboratory/RFdiffusion3 are 404; anything claiming otherwise
# is guessing. Checked 2026-09-17.
NAME=rfdiffusion3
VERSION=0.2.0
KIND=container
STATUS=verified
LICENSE=BSD-3-Clause
UPSTREAM=https://github.com/RosettaCommons/foundry
UPSTREAM_REF="rc-foundry==0.2.0, torch 2.7.1 moved cu126 to cu128"
NOTE="RFdiffusion3, via rc-foundry. Separate entry from rfdiffusion (v1) and rfdiffusion2: different weights, different CLI, different licence lineage. v1 stays because the round-0 exosite track is written against its hydra config. As of the rfdiffusion3_0.2.0_cu128 entry this RUNS ON sm_120, measured on an RTX 5090 2026-11-03, so a bare --gres=gpu:1 is now correct for it. The cu126 recipe is kept beside it and does NOT: torch 2.7.1/cu126 stops at sm_90 with no compute_* entry, so Blackwell was no path there rather than a slow one, and it needs --gres=gpu:nvidia_l40s:1 or an H100. Handles covalent modifications, but ONLY from bonds already in the input file -- there is no way to declare one, and a missing _struct_conn record gives a free ligand with no warning. Runs on CPU too, about 100x slower, announcing the fallback at ERROR level."

IMAGE=rfdiffusion3_0.2.0_cu128.sif
GPU=1
# Highest compute capability this image has kernels for, measured with
# torch._C._cuda_getArchFlags(). chpc-tool refuses a newer device up front.
# 12.0 as of the rfdiffusion3_0.2.0_cu128 image, 2026-11-03. MEASURED with
# torch._C._cuda_getArchFlags(): sm_75 sm_80 sm_86 sm_90 sm_100 sm_120
# compute_120, on torch 2.7.1+cu128. The base foundry image answers
# sm_50..sm_90 on torch 2.7.1+cu126, with no compute_* entry.
#
# This is the SAME torch version, only the cu128 build, so unlike every
# other sm_120 rebuild here no python API moved and no chemistry re-check is
# owed on version grounds. Note that this image answers
# torch.cuda.get_arch_list() with an empty list while _cuda_getArchFlags()
# answers correctly; use the latter, as the rest of this registry does.
#
# QUALIFIED ON A REAL DESIGN, not just on arch flags. `chpc-tool test
# rfdiffusion3` passed on an RTX 5090 (cc 12.0) on 2026-11-03 in ~60 s: a
# 60-residue backbone with clean peptide CA-CA geometry, then a 120-residue de
# novo scaffold built around the P1B7 sotorasib-modified cysteine from 8UDR,
# with MOV C25 still bonded to CYS A112 SG at 1.770 A against 1.765 A in the
# deposited structure, insertion RMSD 0.782 A, and both designs confirmed to
# have run on CUDA with no accelerator fallback in either log.
#
# ONE MORE THING sm_120 NEEDS, and the entry's own test does NOT cover it.
# Triton JIT-compiles its `cuda_utils` module at the first kernel launch by
# shelling out to a C compiler. The foundry base ships none -- neither does the
# cu126 image -- and on an L40S that never mattered, because the Triton 3.3.1
# wheel carries prebuilt kernels for sm_89. On sm_120 it carries none, so the
# JIT path is the only path, and a fold dies with
#   RuntimeError: Failed to find C compiler. Please specify via CC ...
#
# MEASURED 2026-11-09 on an RTX 5090: a real covalent fold through the
# consuming project's rf3 adapter FAILED at 17 s this way, while `chpc-tool
# test rfdiffusion3` PASSED on the same device and image minutes earlier. The
# test exercises the DESIGN path; the adapter exercises FOLDING; only folding
# reaches Triton. So a green entry test is not evidence that a fold works here,
# and this is the second time in this registry that a tool's own test answered
# more simply than the real job did.
#
# Fixed in the def by installing build-essential, with a build-time assert that
# repeats triton/runtime/build.py's own lookup (os.environ["CC"], then
# shutil.which) from inside python rather than from the shell. After the
# rebuild the same fold succeeds in 56 s and publishes two artifacts.
GPU_MAX_CC=12.0
# Both designs of test.sh ran here: ggpu1-10, job 2006076, 2026-09-27,
# 1 m 50 s, with stage 1 asserting no accelerator fallback. The L40S alone --
# GPU_MAX_CC=9.0 admits the H100 NVL too, and nothing has run on one.
GPU_TESTED=nvidia_l40s,nvidia_geforce_rtx_5090
# foundry writes to /app/foundry/.env inside the image (dotenv.set_key)
# whenever it resolves or installs checkpoints. Without an overlay that is
#   OSError: [Errno 30] Read-only file system: '/app/foundry/.tmp_XXXXXXXX'
# which names neither .env nor dotenv and reads as a broken image.
WRITABLE_TMPFS=1
APPDIR=/app/foundry          # upstream's uv project root, NOT /opt
ENTRY=rfd3

# Checkpoints are ~14.6 GB and are NOT in the image -- the slim base exists
# precisely so they are not. foundry reads a colon-separated list of directories
# from FOUNDRY_CHECKPOINT_DIRS; one FAC directory is enough.
tool_exports() {
  echo "SIF_RFDIFFUSION3=\"$(_image_path)\""
  echo "FOUNDRY_CHECKPOINT_DIRS=\"$(_refdata rfdiffusion3)\""
  # PASS ckpt_path EXPLICITLY. The image ships /app/foundry/.env with
  #   FOUNDRY_CHECKPOINT_DIRS='/test-weights:/root/.foundry/checkpoints'
  # and dotenv wins over the environment, so `ckpt_path=rfd3` resolves to
  # /test-weights/rfd3_latest.ckpt and dies with "Invalid checkpoint: rfd3".
  # An absolute path sidesteps the whole question. This is also why
  # `foundry list-installed` reports nothing on a working installation.
  echo "RFD3_CKPT=\"$(_refdata rfdiffusion3)/rfd3_latest.ckpt\""
  echo "RF3_CKPT=\"$(_refdata rfdiffusion3)/rf3_foundry_01_24_latest_remapped.ckpt\""
}

tool_doctor() {
  _d="$(_refdata rfdiffusion3)"
  [ -d "$_d" ] || { echo "no checkpoints at $_d -- on the LOGIN node: tools/rfdiffusion3/fetch-weights.sh"; return 1; }
  # A directory that exists but holds nothing is the failure a path test misses:
  # it is what a download interrupted at minute one leaves behind.
  _n=$(find "$_d" -name '*.pt' -o -name '*.ckpt' 2>/dev/null | head -1)
  [ -n "$_n" ] || { echo "$_d exists but holds no checkpoint files"; return 1; }
  # The covalent stages of test.sh need 8UDR, which rides with the
  # checkpoints because the share carries tools/ and not examples/. Absence is
  # a real FAIL -- the test cannot run without it -- and the fix is one line.
  [ -f "$_d/8UDR.cif.gz" ] || {
    echo "checkpoints present but no 8UDR.cif.gz in $_d"
    echo "  fix: tools/rfdiffusion3/fetch-weights.sh --fixture"; return 1; }
  echo "checkpoints $_d, with the 8UDR covalent fixture"
}
