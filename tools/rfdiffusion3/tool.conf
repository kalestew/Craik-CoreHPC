# RFdiffusion3 -- generative backbone design, the current Baker-lab model.
#
# There is no RFdiffusion3 repository. The model ships as the `rfd3` component
# of RosettaCommons/foundry (pip `rc-foundry`), which also carries RF3 and an
# MPNN entry point. Both github.com/RosettaCommons/RFdiffusion3 and
# github.com/baker-laboratory/RFdiffusion3 are 404; anything claiming otherwise
# is guessing. Checked 2026-09-17.
NAME=rfdiffusion3
VERSION=0.2.0
KIND=container
STATUS=built
LICENSE=BSD-3-Clause
UPSTREAM=https://github.com/RosettaCommons/foundry
UPSTREAM_REF=rc-foundry==0.2.0
NOTE="RFdiffusion3, via rc-foundry. Separate entry from rfdiffusion (v1) and rfdiffusion2: different weights, different CLI, different licence lineage. v1 stays because the round-0 exosite track is written against its hydra config. torch 2.7.1/cu126 means NO sm_120: ask for --gres=gpu:nvidia_l40s:1 or an H100, never a bare --gres=gpu:1."

IMAGE=rfdiffusion3_0.2.0.sif
GPU=1
# foundry writes to /app/foundry/.env inside the image (dotenv.set_key)
# whenever it resolves or installs checkpoints. Without an overlay that is
#   OSError: [Errno 30] Read-only file system: '/app/foundry/.tmp_XXXXXXXX'
# which names neither .env nor dotenv and reads as a broken image.
WRITABLE_TMPFS=1
APPDIR=/app/foundry          # upstream's uv project root, NOT /opt
ENTRY=rfd3

# Checkpoints are ~14.6 GB and are NOT in the image -- the slim base exists
# precisely so they are not. foundry reads a colon-separated list of directories
# from FOUNDRY_CHECKPOINT_DIRS; one FAC directory is enough.
tool_exports() {
  echo "SIF_RFDIFFUSION3=\"$(_image_path)\""
  echo "FOUNDRY_CHECKPOINT_DIRS=\"$(_refdata rfdiffusion3)\""
}

tool_doctor() {
  _d="$(_refdata rfdiffusion3)"
  [ -d "$_d" ] || { echo "no checkpoints at $_d -- on the LOGIN node: tools/rfdiffusion3/fetch-weights.sh"; return 1; }
  # A directory that exists but holds nothing is the failure a path test misses:
  # it is what a download interrupted at minute one leaves behind.
  _n=$(find "$_d" -name '*.pt' -o -name '*.ckpt' 2>/dev/null | head -1)
  [ -n "$_n" ] || { echo "$_d exists but holds no checkpoint files"; return 1; }
  echo "checkpoints $_d"
}
