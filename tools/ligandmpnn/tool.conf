# LigandMPNN -- ProteinMPNN with ligand and substrate context.
NAME=ligandmpnn
VERSION=1
KIND=container
STATUS=verified
LICENSE=MIT
UPSTREAM=https://github.com/dauparas/LigandMPNN
NOTE="Subsite redesign with the substrate or covalent intermediate present, which plain ProteinMPNN cannot see."
IMAGE=ligandmpnn_1.sif
GPU=1
APPDIR=/opt/LigandMPNN
ENTRY=python
tool_exports() {
  echo "SIF_LIGANDMPNN=\"$(_image_path)\""
  echo "LIGANDMPNN_DIR=\"$APPDIR\""
}
