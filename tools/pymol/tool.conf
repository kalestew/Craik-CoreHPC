# PyMOL -- open-source build, for scripted rendering in batch.
NAME=pymol
VERSION=
KIND=container
STATUS=planned
LICENSE="BSD-like (open-source PyMOL, NOT the Schrodinger incentive build)"
UPSTREAM=https://github.com/schrodinger/pymol-open-source
NOTE="Headless figure generation on the cluster. Build the open-source version: the Schrodinger distribution is separately licensed and must not go on a shared share."
IMAGE=pymol_opensource.sif
GPU=0
ENTRY=pymol
tool_exports() { echo "SIF_PYMOL=\"$(_image_path)\""; }
