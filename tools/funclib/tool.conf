# FuncLib / htFuncLib -- epistasis-aware multipoint active-site libraries.
NAME=funclib
VERSION=
KIND=native
# STATUS=external, not planned. This is a Weizmann WEB SERVER, and the only
# local form is a Rosetta protocol that would have to be written from scratch
# against the rosetta entry. Carried as `planned` it read as a pending build
# that was never coming. See README.md for how the lab actually uses it and
# what a local install would really involve.
STATUS=external
LICENSE="free academic web service; local use needs a Rosetta licence"
UPSTREAM=https://funclib.weizmann.ac.il/
UPSTREAM_REF="web service; no local install, no version pinned here"
NOTE="Used as the Weizmann web server, deliberately not installed. Highest-value classical addition for subsite redesign, and never applied to this fold. Submit the structure and the designable positions through the web form, and bring the resulting library back as a sequence list; nothing on CoreHPC participates. A local install is a Rosetta protocol (PSSM generation, then combinatorial design under an epistasis filter) that nobody here has written, and it needs the rosetta entry plus a licence -- so external is the end state, not a stop on the way to an image. THE OUTPUT IS A LIBRARY, NOT A DESIGN: FuncLib returns tens to hundreds of multipoint variants meant to be screened, so the downstream question is expression and assay capacity, not which single variant to make."

tool_exports() {
  # Nothing to export: there is no local installation to point at. A caller
  # that wants the web service wants a browser, and a caller that wants a
  # variable here has misread this entry.
  :
}

tool_doctor() {
  echo "web service at $UPSTREAM -- nothing installed on CoreHPC by design"
}
