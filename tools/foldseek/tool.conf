# Foldseek -- structural search, fast.
NAME=foldseek
VERSION=10-941cd33
KIND=container
STATUS=verified
LICENSE=GPL-3.0
UPSTREAM=https://github.com/steineggerlab/foldseek
NOTE="Structure-level homology search. Useful for finding scaffolds and for off-target screening against the human structural proteome."
IMAGE=foldseek_10.sif
GPU=0
ENTRY=foldseek
tool_exports() {
  echo "SIF_FOLDSEEK=\"$(_image_path)\""
  # Databases live under data/foldseek, one directory per database, the
  # prefix inside named like the directory; fetch-db.sh writes that layout.
  echo "FOLDSEEK_DB_DIR=\"$(_refdata foldseek)\""
  echo "FOLDSEEK_DB_PDB=\"$(_refdata foldseek)/pdb/pdb\""
}

tool_doctor() {
  _p="$(_refdata foldseek)/pdb/pdb"
  if [ -f "$_p" ]; then
    echo "PDB database $_p"
  else
    # A warning, not a failure: the image is whole without a database, the
    # self-test searches a structure against itself, and a project may bring
    # its own target. But `easy-search` against $FOLDSEEK_DB_PDB dies here.
    echo "WARNING: no PDB database at $_p -- on the login node: tools/foldseek/fetch-db.sh"
  fi
}
