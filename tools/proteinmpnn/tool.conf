# ProteinMPNN -- inverse folding / sequence design. See README.md.
NAME=proteinmpnn
VERSION=1.0
KIND=container
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/dauparas/ProteinMPNN
UPSTREAM_REF=               # set to the built commit when STATUS becomes built

IMAGE=proteinmpnn_1.0.sif
GPU=1
APPDIR=/opt/ProteinMPNN     # the checkout inside the image
ENTRY=python

# The soluble weights need no variable of their own: they ship inside the image
# and are selected at the call site with ProteinMPNN's own --use_soluble_model.
tool_exports() {
  echo "SIF_PROTEINMPNN=\"$(_image_path)\""
  echo "PROTEINMPNN_DIR=\"$APPDIR\""
}

tool_doctor() {
  # helper_scripts/ is what stages 40 and 51 reach into, so its absence is the
  # failure that matters and it is not visible from the image file alone.
  apptainer exec "$(_image_path)" test -d "$APPDIR/helper_scripts" 2>/dev/null \
    || { echo "no $APPDIR/helper_scripts inside the image"; return 1; }
  echo "helper_scripts present"
}
