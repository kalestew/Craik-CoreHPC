# ESM-2 -- naturalness prefilter.
#
# DO NOT BUILD THIS YET. It is wired end to end in IgGase_eng -- run_tool, both
# site configs and the readiness check all know about it -- but no stage
# invokes it. The wiring is deliberate forward-work for a naturalness prefilter
# that is scoped as a GPU saving, not a round-0 decision. Four images, not five.
NAME=esm
VERSION=2
KIND=container
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/facebookresearch/esm
UPSTREAM_REF=

IMAGE=esm_2.sif
GPU=1
ENTRY=python

tool_exports() {
  echo "SIF_ESM=\"$(_image_path)\""
}
