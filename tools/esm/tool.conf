# ESM-2 -- protein language model, for naturalness / pseudo-likelihood scoring.
#
# Which ESM this is, because there are now two unrelated packages with the name.
# `fair-esm` 2.0.0 (this entry) is the archived facebookresearch/esm, and it is
# the one that carries ESM-2 650M/3B -- which is what "ESM pseudo-likelihood"
# means in the literature and what IgGase_eng's naturalness prefilter is wired
# for. The newer PyPI `esm` package is EvolutionaryScale's, now Chan Zuckerberg
# Biohub (acquired Nov 2025; github.com/evolutionaryscale/esm redirects to
# github.com/Biohub/esm), and it carries ESM-C and ESM3 and NO ESM-2 at all.
# It is MIT now rather than the old non-commercial community licence, so it is
# a reasonable thing to add later -- as its own entry, not by editing this one.
NAME=esm
VERSION=2
KIND=container
STATUS=planned
LICENSE=MIT
UPSTREAM=https://github.com/facebookresearch/esm
UPSTREAM_REF=fair-esm==2.0.0

IMAGE=esm_2.sif
GPU=1
ENTRY=python

# No weights variable, and no TORCH_HOME: the two ESM-2 checkpoints are baked
# into the image, which is the right call for a model that was frozen in 2022
# and never revised. It also avoids exporting TORCH_HOME -- a SHARED name that
# would redirect torch.hub for every other tool in the same job script.
tool_exports() {
  echo "SIF_ESM=\"$(_image_path)\""
}

tool_doctor() {
  # Loading the checkpoint is the check. A truncated download leaves a file
  # that exists, has a plausible size, and only fails when torch unpickles it.
  apptainer exec "$(_image_path)" python -c \
    "import esm; m,_ = esm.pretrained.esm2_t33_650M_UR50D(); print(sum(p.numel() for p in m.parameters()))" \
    >/dev/null 2>&1 || { echo "esm2_t33_650M_UR50D did not load from inside the image"; return 1; }
  echo "esm2_t33_650M_UR50D loads"
}
