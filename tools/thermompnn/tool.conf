# ThermoMPNN -- stability ddG prediction, the third vote in the consensus.
NAME=thermompnn
VERSION=1
KIND=container
# STATUS=verified 2026-09-27 on ggpu1-10 (NVIDIA L40S): test.sh reproduced
# upstream's own shipped reference prediction for 2OCJ chain A EXACTLY --
# pearson r = 1.000000 over 3880 mutations, mean |difference| 0.0000 kcal/mol --
# in 23 s, on torch 2.14.0+cu132. The r>0.99 threshold in the test exists to
# tolerate reordered floating-point reductions from running a different torch
# than upstream pinned; none were needed. sm_89 is covered by the sm_86 cubin,
# as the arch-flag check in %post predicted.
STATUS=verified
LICENSE=MIT
UPSTREAM=https://github.com/Kuhlman-Lab/ThermoMPNN
UPSTREAM_REF=370f76ec62bd929f7425e311d8df04a0d094990f
NOTE="The missing third member of the stability consensus. Until it exists the consensus is FoldX plus Rosetta only, which is two votes, not three. THREE THINGS WILL BE READ WRONG IF THEY ARE NOT READ HERE FIRST. (1) SIGN: positive ddG_pred is DESTABILISING -- upstream negates the Megascale ddG_ML at training time, so the sign is the opposite of that dataset's, and a consensus that averages this with FoldX without checking will cancel rather than agree. (2) POSITION: the position column is a 0-BASED INDEX into the parsed chain, not a PDB residue number; map it back through the structure before quoting a mutation to a chemist. (3) MONOMERS ONLY: multi-chain inputs are not supported upstream, so a complex has to be split and each chain run alone, which also means no interface effects. Co-folding models barely respond to point mutations (Masters 2025) and this is the tool that is supposed to, so it is the one whose sign errors do real damage."

IMAGE=thermompnn_1.sif
GPU=1
# test.sh ran here: ggpu1-10, job 2005674, 2026-09-27, 23 s, reproducing
# upstream's 2OCJ reference at pearson r = 1.000000 over 3880 mutations. The
# L40S is sm_89 and this image carries no sm_89 cubin -- sm_86 covered it by
# intra-major forward compatibility, which is the thing this record proves and
# GPU_MAX_CC could not have.
GPU_TESTED=nvidia_l40s
# GPU_MAX_CC deliberately EMPTY: the image is built on a CUDA 13.2 base and
# %post asserts sm_89, sm_90 AND sm_120 are all in torch's arch flags, so there
# is no ceiling to declare. If a future rebuild loses sm_120, that assertion
# fails the build rather than letting a job discover it on a Blackwell node.
GPU_MAX_CC=
APPDIR=/opt/ThermoMPNN
ENTRY=python
tool_exports() {
  echo "SIF_THERMOMPNN=\"$(_image_path)\""
  echo "THERMOMPNN_DIR=\"$APPDIR\""
  echo "THERMOMPNN_CKPT=\"$APPDIR/models/thermoMPNN_default.pt\""
}

tool_doctor() {
  # No refdata: the checkpoints are committed in upstream's repo and baked into
  # the image, so there is nothing on the share to go missing after a purge.
  # What can go wrong is the image, and specifically the two things this entry
  # needs that "the .sif exists" does not cover.
  if command -v apptainer >/dev/null 2>&1; then
    apptainer exec "$(_image_path)" test -s "$APPDIR/models/thermoMPNN_default.pt" \
      || { echo "no thermoMPNN_default.pt in the image"; return 1; }
    apptainer exec "$(_image_path)" test -s "$APPDIR/examples/ThermoMPNN_inference_2OCJ.csv" \
      || { echo "no reference output in the image -- test.sh has nothing to compare against"; return 1; }
    echo "checkpoint and reference output baked in; weights are in-repo, nothing on the share"
  else
    echo "weights are baked into the image, not on the share; image unchecked (no apptainer here)"
  fi
}
