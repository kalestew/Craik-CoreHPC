# NetMHCIIpan -- MHC class II binding prediction, for immunogenicity burden.
# Licensed, and not yet wired to any stage. See assets.tsv.
NAME=netmhciipan
VERSION=4.3
KIND=native
STATUS=planned
LICENSE="free for academic use, licence required otherwise; DTU Health Tech"
UPSTREAM=https://services.healthtech.dtu.dk/services/NetMHCIIpan-4.3/
UPSTREAM_REF=
NOTE="MHC class II binding prediction, for immunogenicity burden. BLOCKED ON A DOWNLOAD, NOT ON WORK: the software and data tarballs are requested separately through a form on the DTU page, free for academic use, and cannot be fetched by script. assets.tsv is the shopping list and chpc-assets install is the one command needed once they arrive. TWO THINGS FAIL AT RUNTIME RATHER THAN AT INSTALL, and both are checked by tool_doctor. (1) The wrapper ships with the AUTHOR'S path baked into NMHOME and must be edited to point at the install directory. (2) It needs a scratch directory that exists, named inside the same wrapper. Nothing in this pipeline calls it yet; the immunogenicity filter is wired to skip and flag when NETMHCIIPAN is empty, which is why tool_exports deliberately emits an EMPTY value rather than a path that does not work -- a caller testing for a non-empty string gets the right answer either way. CLASS II ONLY: this predicts CD4 epitopes. Class I is a different tool and is not in the registry."

PREFIX=$CHPC_SOFTWARE/netMHCIIpan-4.3

tool_exports() {
  _b="$PREFIX/netMHCIIpan"
  [ -x "$_b" ] || _b=""
  echo "NETMHCIIPAN=\"$_b\""
}

tool_doctor() {
  [ -x "$PREFIX/netMHCIIpan" ] || { echo "no netMHCIIpan under $PREFIX"; return 1; }
  # The tarball ships a wrapper with a hardcoded NMHOME that must be edited on
  # install, and a tmp dir that must exist. Both fail at runtime, not at -x.
  grep -q "NMHOME=$PREFIX" "$PREFIX/netMHCIIpan" 2>/dev/null \
    || { echo "NMHOME in $PREFIX/netMHCIIpan does not point at $PREFIX"; return 1; }
  echo "netMHCIIpan $VERSION"
}
